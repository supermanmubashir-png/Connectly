<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SyncBee</title>
<meta name="theme-color" content="#0f9d8f">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.png" type="image/png">
<link rel="apple-touch-icon" href="icon.png">
<style>
:root{--bg:#f3f6f5;--card:#fff;--tx:#17201f;--mut:#617370;--ac:#0f9d8f;--acs:#d6f1ed;--out:#c8eee8;--in:#fff;--bd:#e0e8e6;--err:#d64545;--warn:#c9821a;--ok:#1d9b57;--r:20px}
[data-theme=dark]{--bg:#0e1413;--card:#172120;--tx:#e8f0ef;--mut:#8da09d;--acs:#1b3b37;--out:#1b4943;--in:#202c2b;--bd:#2a3837}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font:15px/1.4 system-ui,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);overflow:hidden}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
#app{height:100dvh;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
main{flex:1;min-height:0;position:relative}
.view{position:absolute;inset:0;display:none}.view.on{display:flex}
.ib{background:none;border:0;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;cursor:pointer;color:var(--tx)}
.ib:hover{background:var(--acs)}.ib svg{width:24px;height:24px;fill:currentColor}
.btn{border:0;border-radius:999px;padding:10px 18px;cursor:pointer;background:var(--acs);color:var(--tx);min-height:44px}
.btn.pri{background:var(--ac);color:#fff}.btn.danger{background:var(--err);color:#fff}
.lnk{background:none;border:0;color:var(--ac);cursor:pointer;padding:6px 0;text-decoration:underline}
input,textarea,select{background:var(--bg);border:1px solid var(--bd);border-radius:14px;padding:10px 14px;width:100%}
/* chats */
#list{width:100%;display:flex;flex-direction:column;background:var(--card);min-width:0}
.hd{display:flex;align-items:center;gap:8px;padding:10px 12px;min-height:60px}
.hd h1{font-size:22px;margin:0;flex:1}
.sig{font-size:12px;color:var(--mut)}
#sq{margin:0 12px 8px;width:auto}
#cl{flex:1;overflow:auto;padding:4px 8px}
.ci{display:flex;gap:12px;align-items:center;padding:10px;border-radius:var(--r);cursor:pointer;width:100%;background:none;border:0;text-align:left}
.ci:hover,.ci.sel{background:var(--acs)}
.av{width:48px;height:48px;border-radius:50%;background:var(--ac);color:#fff;display:grid;place-items:center;font-weight:600;position:relative;flex:none}
.av i{position:absolute;right:0;bottom:0;width:13px;height:13px;border-radius:50%;border:2px solid var(--card);background:var(--mut)}
.av i.online{background:var(--ok)}.av i.connecting,.av i.reconnecting{background:var(--warn)}.av i.failed{background:var(--err)}
.cm{flex:1;min-width:0}.cm b,.cm span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cm span{color:var(--mut);font-size:13px}.ct{font-size:12px;color:var(--mut);text-align:right}
.bg{background:var(--ac);color:#fff;border-radius:999px;font-size:12px;padding:1px 7px;display:inline-block;margin-top:3px}
#chat{display:none;flex:1;flex-direction:column;min-width:0}
#v-chats.open #list{display:none}#v-chats.open #chat{display:flex}
#emp,.empty{margin:auto;text-align:center;color:var(--mut);padding:24px;max-width:340px}
#cc{display:none;flex-direction:column;flex:1;min-height:0}
#chat.has #cc{display:flex}#chat.has #emp{display:none}
#ch{background:var(--card);border-bottom:1px solid var(--bd)}
#ch .nm{flex:1;min-width:0}#ch .nm b,#ch .nm span{display:block;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#ch .nm span{font-size:12px;color:var(--mut)}
#cs{display:none;margin:6px 12px}
#msgs{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:6px}
.m{max-width:min(78%,560px);padding:8px 12px;border-radius:18px;position:relative;word-wrap:break-word;overflow-wrap:anywhere}
.m.in{background:var(--in);align-self:flex-start;border-bottom-left-radius:6px}
.m.out{background:var(--out);align-self:flex-end;border-bottom-right-radius:6px}
.m .tx{white-space:pre-wrap}.m .mt{font-size:11px;color:var(--mut);margin-top:2px;display:flex;gap:6px;align-items:center;justify-content:flex-end}
.m .mb{background:none;border:0;color:var(--mut);cursor:pointer;padding:0 4px}
.file .fn{font-weight:600}.file .fs{font-size:12px;color:var(--mut)}.file .err,.m .er{color:var(--err)}
.bar{height:6px;background:var(--bd);border-radius:6px;overflow:hidden;margin:6px 0;min-width:180px}.bar i{display:block;height:100%;background:var(--ac)}
.pv{max-width:100%;max-height:260px;border-radius:12px;margin-top:6px;display:block}
#cp{display:flex;gap:6px;align-items:flex-end;padding:8px 10px calc(8px);background:var(--card);border-top:1px solid var(--bd)}
#cp textarea{resize:none;max-height:120px;border-radius:22px}
/* settings */
#v-set{overflow:auto;padding:12px;flex-direction:column;gap:12px;align-items:center}
.card{background:var(--card);border-radius:var(--r);padding:16px;width:100%;max-width:720px}
.card h2{margin:0 0 8px;font-size:16px}.card p{margin:6px 0;color:var(--mut)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row.end{justify-content:flex-end;margin-top:14px}
.row>*{flex:0 1 auto}.grow{flex:1 1 160px!important}
details summary{cursor:pointer;padding:6px 0}details p{color:var(--mut)}
/* nav */
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));width:min(92vw,440px);display:flex;gap:4px;padding:6px;border-radius:999px;background:color-mix(in srgb,var(--card) 82%,transparent);-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);box-shadow:0 8px 28px rgba(0,0,0,.18),0 0 0 1px var(--bd);z-index:5}
nav button{flex:1;background:none;border:0;border-radius:999px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:1px;font-size:11px;cursor:pointer;padding:7px 4px;transition:background .25s,color .25s}
nav .pill{display:grid;place-items:center}
nav svg{width:22px;height:22px;fill:currentColor}
nav button.on{background:var(--acs);color:var(--ac);font-weight:600}
@media(max-width:819px){body.inchat nav{display:none}}
@media(min-width:820px){#app main{margin-bottom:92px}nav{width:460px;bottom:16px}}
dialog{border:0;border-radius:28px;background:var(--card);color:var(--tx);padding:20px;width:min(460px,92vw)}
dialog::backdrop{background:rgba(0,0,0,.45)}dialog h3{margin:0 0 10px}dialog p{color:var(--mut);margin:6px 0}
.mono{font-family:ui-monospace,Consolas,monospace;font-size:13px;word-break:break-all}
#toasts{position:fixed;left:0;right:0;bottom:calc(84px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;z-index:9}
.toast{background:#263130;color:#fff;border-radius:16px;padding:10px 16px;pointer-events:auto;max-width:92vw;display:flex;gap:12px;align-items:center}
.toast button{background:none;border:0;color:#7fe3d8;cursor:pointer}
@media(min-width:820px){#list{width:360px;flex:none;border-right:1px solid var(--bd)}#chat{display:flex}#v-chats.open #list{display:flex}.bk{display:none!important}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

#cl,#stp{padding-bottom:104px}#v-set{padding-bottom:110px}#emb{font-size:22px}
[data-ac=blue]{--ac:#2f7de1;--acs:#d9e8fb;--out:#cfe2fa}[data-ac=purple]{--ac:#7c5cd6;--acs:#e6dffa;--out:#ddd3f7}[data-ac=rose]{--ac:#d6457a;--acs:#fbdce8;--out:#f7cfdf}[data-ac=amber]{--ac:#d98a1c;--acs:#fbebd0;--out:#f8e2bc}[data-ac=green]{--ac:#2e9b4f;--acs:#d9f3e0;--out:#cdeed7}
[data-theme=dark][data-ac=blue]{--acs:#1b2e4a;--out:#1d3a63}[data-theme=dark][data-ac=purple]{--acs:#2b2347;--out:#3a2f66}[data-theme=dark][data-ac=rose]{--acs:#47202f;--out:#5e2a3f}[data-theme=dark][data-ac=amber]{--acs:#433116;--out:#5a431c}[data-theme=dark][data-ac=green]{--acs:#1a3b25;--out:#1f4d30}
html[data-fs=s] body{font-size:13.5px}html[data-fs=l] body{font-size:17px}
#msgs[data-wp=dots]{background-image:radial-gradient(var(--bd) 1.2px,transparent 1.2px);background-size:20px 20px}#msgs[data-wp=lines]{background-image:repeating-linear-gradient(45deg,transparent 0 14px,var(--bd) 14px 15px)}#msgs[data-wp=tint]{background:var(--acs)}
.tabs{display:flex;gap:6px;padding:0 12px 8px}.tabs button{flex:1;border:0;border-radius:999px;padding:8px;background:var(--bg);cursor:pointer;color:var(--mut)}.tabs button.on{background:var(--acs);color:var(--ac);font-weight:600}
.chips{display:flex;gap:6px;padding:0 12px 6px;overflow:auto}.chip{border:1px solid var(--bd);background:none;border-radius:999px;padding:4px 12px;cursor:pointer;white-space:nowrap}.chip.on{background:var(--acs);border-color:var(--ac)}
.av img{width:100%;height:100%;border-radius:50%;object-fit:cover}.av.ring{box-shadow:0 0 0 3px var(--card),0 0 0 5px var(--ac)}.av.ring.seen{box-shadow:0 0 0 3px var(--card),0 0 0 5px var(--mut)}
.q{border-left:3px solid var(--ac);background:rgba(127,127,127,.12);border-radius:8px;padding:4px 8px;margin-bottom:4px;font-size:13px}.q b{display:block;color:var(--ac)}.q span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--mut)}
.rc{position:absolute;bottom:-12px;right:10px;background:var(--card);border:1px solid var(--bd);border-radius:999px;padding:0 6px;font-size:13px}.m.hr{margin-bottom:12px}
#rb{display:none;align-items:center;gap:8px;padding:6px 12px;background:var(--card);border-top:1px solid var(--bd)}#rb .q{flex:1;margin:0;min-width:0}
#em{display:none;padding:8px 10px;background:var(--card);border-top:1px solid var(--bd);max-height:250px;overflow:auto}
.ov{position:fixed;inset:0;background:#000e;z-index:20;display:flex;flex-direction:column;color:#fff}.ov .sc{flex:1;display:grid;place-items:center;align-content:center;padding:24px;text-align:center;font-size:26px;min-height:0}.ov .sc img{max-width:100%;max-height:70vh;border-radius:12px}
.pb{display:flex;gap:4px;padding:10px}.pb i{flex:1;height:3px;border-radius:3px;background:#fff5}.pb i.d{background:#fff}.ov .tp{display:flex;justify-content:space-between;align-items:center;padding:6px 12px;gap:8px}.ov .ib{color:#fff}
.sw{display:flex;gap:8px;flex-wrap:wrap}.sw button{width:32px;height:32px;border-radius:50%;border:2px solid transparent;cursor:pointer}.sw button.on{border-color:var(--tx)}
.star{color:#e0a800}.del{font-style:italic;color:var(--mut)}.mt .ed{font-style:italic}
html[data-bub=classic] .m{border-radius:8px}html[data-bub=flat] .m{border-radius:4px;border:1px solid var(--bd)}
html[data-dens=compact] .m{padding:4px 10px}html[data-dens=compact] #msgs{gap:3px}html[data-dens=compact] .ci{padding:6px 10px}
html[data-rm=on] *{transition:none!important;animation:none!important}
.dsep{align-self:center;background:var(--card);color:var(--mut);font-size:12px;border-radius:999px;padding:2px 12px;margin:6px 0}
.m a{color:var(--ac)}.fw{font-size:12px;color:var(--mut);font-style:italic}
#lock{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px}#lock input{max-width:260px;text-align:center;font-size:22px;letter-spacing:6px}

html[data-avs=off] .ci .av{display:none}
.m.nb{background:none;padding:0}.stk{width:var(--stk,150px);height:var(--stk,150px);object-fit:contain;display:block}.tx.big{font-size:44px;line-height:1.1}
#mic.rec{color:#fff;background:var(--err)}
.sg{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:6px;margin-top:8px}.sg img{width:100%;aspect-ratio:1;object-fit:contain;cursor:pointer;border-radius:10px;background:var(--bg)}.sg .it{position:relative}.sg .it b{position:absolute;top:0;right:0;background:var(--card);border-radius:50%;width:20px;height:20px;text-align:center;cursor:pointer;font-weight:400;line-height:20px}
#v-posts{overflow:auto;padding:12px 12px 110px;flex-direction:column;align-items:center}.pw{width:100%;max-width:640px;display:flex;flex-direction:column;gap:12px}
.pc{background:var(--card);border-radius:var(--r);padding:14px}.pc img.pi{max-width:100%;border-radius:14px;margin-top:8px;display:block}.pc .row{margin-top:8px}

.pillbtn{display:block;margin:0 12px 8px;padding:8px 14px;border-radius:999px;background:var(--acs);color:var(--ac);text-align:center;font-size:13px;font-weight:600;text-decoration:none}.pillbtn:hover{filter:brightness(.96)}
#chat{position:relative}#dz{display:none;position:absolute;inset:8px;background:color-mix(in srgb,var(--ac) 16%,transparent);border:3px dashed var(--ac);border-radius:20px;align-items:center;justify-content:center;font-size:20px;font-weight:600;color:var(--ac);z-index:4;pointer-events:none}
.dd{position:fixed;z-index:40;min-width:190px;max-width:260px;max-height:70vh;overflow:auto;background:var(--card);border:1px solid var(--bd);border-radius:16px;box-shadow:0 12px 32px rgba(0,0,0,.22);padding:6px;display:flex;flex-direction:column}
.dd button{background:none;border:0;text-align:left;padding:9px 12px;border-radius:10px;cursor:pointer;color:var(--tx)}.dd button:hover,.dd button:focus-visible{background:var(--acs)}.dd button.danger{color:var(--err)}.dd hr{border:0;border-top:1px solid var(--bd);margin:4px 0;width:100%}.ddr{display:flex;gap:2px;justify-content:space-between;padding:2px 4px}.ddr button{font-size:20px;padding:4px 6px}
.lc{display:block;border:1px solid var(--bd);border-radius:12px;padding:6px 10px;margin-bottom:6px;text-decoration:none;color:var(--tx);background:rgba(127,127,127,.08);max-width:320px}.lc b{display:block;font-size:13px;color:var(--ac)}.lc span{display:block;font-size:12px;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.lc img{max-width:100%;border-radius:8px;margin-top:6px;display:block}
.sx{display:flex;gap:14px;width:100%;max-width:960px;align-items:flex-start}.sn{flex:none;width:210px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0}.sn button{text-align:left;border:0;background:none;padding:11px 14px;border-radius:14px;cursor:pointer;color:var(--tx)}.sn button.on{background:var(--acs);color:var(--ac);font-weight:600}.sc2{flex:1;min-width:0;display:flex;flex-direction:column;gap:12px}.sc2 .card{max-width:none}
@media(max-width:819px){.sx{flex-direction:column}.sn{width:100%;flex-direction:row;overflow:auto;position:static}.sn button{white-space:nowrap}}
html[data-hc=on]{--tx:#000;--mut:#1f2a28;--bd:#5a6b68}html[data-theme=dark][data-hc=on]{--tx:#fff;--mut:#e3eceb;--bd:#9db0ad}html[data-bold=on] .m .tx{font-weight:600}
.gn{font-size:12px;font-weight:600;color:var(--ac);margin-bottom:2px}</style>
</head>
<body>
<div id="app">
<main>
 <section class="view on" id="v-chats">
  <div id="list">
   <div class="hd"><h1>SyncBee</h1><button class="ib" id="addb" aria-label="Add contact"></button></div>
   <div class="sig" style="padding:0 16px 6px" id="sigl">Connection service: starting…</div>
   <a class="pillbtn" href="help.html">New to SyncBee? Learn how to connect, chat, and share files.</a>
   <div class="tabs" role="tablist"><button data-t="chats" class="on">Chats</button><button data-t="status">Status</button></div>
   <input id="sq" type="search" placeholder="Search chats" aria-label="Search chats">
   <div class="chips" id="chips"></div>
   <div id="cl"></div>
   <div id="stp" style="display:none;flex:1;overflow:auto;padding:4px 12px"></div>
  </div>
  <div id="chat">
   <div id="emp"><h2>Connect. Chat. Share.</h2><p>Pick a chat, or add a contact once and SyncBee will reconnect to them automatically afterwards.</p></div>
   <div id="cc">
    <div class="hd" id="ch">
     <button class="ib bk" id="bkb" aria-label="Back to chats"></button>
     <div class="av" id="cav"></div>
     <div class="nm"><b id="cn"></b><span id="cst"></span></div>
     <button class="ib" id="rcb" aria-label="Reconnect" title="Reconnect"></button>
     <button class="ib" id="srb" aria-label="Search in conversation"></button>
     <button class="ib" id="mnb" aria-label="Contact options"></button>
    </div>
    <input id="cs" type="search" placeholder="Search in conversation" aria-label="Search in conversation">
    <div id="msgs" role="log" aria-live="polite"></div>
    <div id="rb"></div><div id="em"></div>
    <div id="cp">
     <button class="ib" id="atb" aria-label="Attach files"></button>
     <button class="ib" id="emb" aria-label="Emoji">😊</button>
     <textarea id="inp" rows="1" placeholder="Message" aria-label="Message"></textarea>
     <button class="ib" id="mic" aria-label="Voice note"></button>
     <button class="ib" id="snb" aria-label="Send"></button>
     <input type="file" id="fi" multiple hidden>
    </div>
   </div>
  </div>
 </section>
 <section class="view" id="v-set"></section>
 <section class="view" id="v-posts"></section>
</main>
<nav aria-label="Main">
 <button data-v="chats" class="on"><span class="pill" data-i="chat"></span>Chats</button>
 <button data-v="posts"><span class="pill" data-i="post"></span>Posts</button>
 <button data-v="util"><span class="pill" data-i="grid"></span>UtiliX</button>
 <button data-v="set"><span class="pill" data-i="tune"></span>Settings</button>
</nav>
</div>
