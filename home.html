<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SyncBee</title>
<meta name="theme-color" content="#0f9d8f">
<link rel="manifest" href="manifest.json">

<style>
:root{--bg:#f3f6f5;--card:#fff;--tx:#17201f;--mut:#617370;--ac:#0f9d8f;--acs:#d6f1ed;--out:#c8eee8;--in:#fff;--bd:#e0e8e6;--err:#d64545;--warn:#c9821a;--ok:#1d9b57;--r:20px}
[data-theme=dark]{--bg:#0e1413;--card:#172120;--tx:#e8f0ef;--mut:#8da09d;--acs:#1b3b37;--out:#1b4943;--in:#202c2b;--bd:#2a3837}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font:15px/1.4 system-ui,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);overflow:hidden}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
#app{height:100dvh;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
main{flex:1;min-height:0;position:relative}
.view{position:absolute;inset:0;display:none}.view.on{display:flex}
.ib{background:none;border:0;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;cursor:pointer;color:var(--tx)}
.ib:hover{background:var(--acs)}.ib svg{width:24px;height:24px;fill:currentColor}
.btn{border:0;border-radius:999px;padding:10px 18px;cursor:pointer;background:var(--acs);color:var(--tx);min-height:44px}
.btn.pri{background:var(--ac);color:#fff}.btn.danger{background:var(--err);color:#fff}
.lnk{background:none;border:0;color:var(--ac);cursor:pointer;padding:6px 0;text-decoration:underline}
input,textarea,select{background:var(--bg);border:1px solid var(--bd);border-radius:14px;padding:10px 14px;width:100%}
/* chats */
#list{width:100%;display:flex;flex-direction:column;background:var(--card);min-width:0}
.hd{display:flex;align-items:center;gap:8px;padding:10px 12px;min-height:60px}
.hd h1{font-size:22px;margin:0;flex:1}
.sig{font-size:12px;color:var(--mut);padding:0 16px 4px}
.help-pill{display:inline-flex;align-items:center;gap:6px;background:var(--acs);color:var(--ac);padding:6px 14px;border-radius:999px;font-size:12px;font-weight:500;text-decoration:none;margin:4px 16px 8px;width:fit-content}
#sq{margin:0 12px 8px;width:auto}
#cl{flex:1;overflow:auto;padding:4px 8px}
.ci{display:flex;gap:12px;align-items:center;padding:10px;border-radius:var(--r);cursor:pointer;width:100%;background:none;border:0;text-align:left}
.ci:hover,.ci.sel{background:var(--acs)}
.av{width:48px;height:48px;border-radius:50%;background:var(--ac);color:#fff;display:grid;place-items:center;font-weight:600;position:relative;flex:none}
.av i{position:absolute;right:0;bottom:0;width:13px;height:13px;border-radius:50%;border:2px solid var(--card);background:var(--mut)}
.av i.online{background:var(--ok)}.av i.connecting,.av i.reconnecting{background:var(--warn)}.av i.failed{background:var(--err)}
.cm{flex:1;min-width:0}.cm b,.cm span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cm span{color:var(--mut);font-size:13px}.ct{font-size:12px;color:var(--mut);text-align:right}
.bg{background:var(--ac);color:#fff;border-radius:999px;font-size:12px;padding:1px 7px;display:inline-block;margin-top:3px}
#chat{display:none;flex:1;flex-direction:column;min-width:0}
#v-chats.open #list{display:none}#v-chats.open #chat{display:flex}
#emp,.empty{margin:auto;text-align:center;color:var(--mut);padding:24px;max-width:340px}
#cc{display:none;flex-direction:column;flex:1;min-height:0}
#chat.has #cc{display:flex}#chat.has #emp{display:none}
#ch{background:var(--card);border-bottom:1px solid var(--bd);position:relative}
#ch .nm{flex:1;min-width:0}#ch .nm b,#ch .nm span{display:block;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#ch .nm span{font-size:12px;color:var(--mut)}
#cs{display:none;margin:6px 12px}
#msgs{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:6px}
.m{max-width:min(78%,560px);padding:8px 12px;border-radius:18px;position:relative;word-wrap:break-word;overflow-wrap:anywhere}
.m.in{background:var(--in);align-self:flex-start;border-bottom-left-radius:6px}
.m.out{background:var(--out);align-self:flex-end;border-bottom-right-radius:6px}
.m .tx{white-space:pre-wrap}.m .mt{font-size:11px;color:var(--mut);margin-top:2px;display:flex;gap:6px;align-items:center;justify-content:flex-end}
.m .mb{background:none;border:0;color:var(--mut);cursor:pointer;padding:0 4px}
.file .fn{font-weight:600}.file .fs{font-size:12px;color:var(--mut)}.file .err,.m .er{color:var(--err)}
.bar{height:6px;background:var(--bd);border-radius:6px;overflow:hidden;margin:6px 0;min-width:180px}.bar i{display:block;height:100%;background:var(--ac)}
.pv{max-width:100%;max-height:260px;border-radius:12px;margin:6px 0;display:block}
#cp{display:flex;gap:6px;align-items:flex-end;padding:8px 10px calc(8px);background:var(--card);border-top:1px solid var(--bd)}
#cp textarea{resize:none;max-height:120px;border-radius:22px}
/* dropdown menus */
.dropdown{position:absolute;right:12px;top:54px;background:var(--card);border:1px solid var(--bd);border-radius:14px;box-shadow:0 8px 24px rgba(0,0,0,.15);display:none;flex-direction:column;z-index:30;min-width:180px;padding:6px 0}
.dropdown.open{display:flex}
.dropdown button{background:none;border:0;text-align:left;padding:10px 16px;cursor:pointer;font-size:14px;color:var(--tx)}
.dropdown button:hover{background:var(--acs)}
.dropdown button.danger{color:var(--err)}
/* settings layout */
#v-set{overflow:auto;padding:12px;flex-direction:row;gap:16px;align-items:flex-start;max-width:1020px;margin:0 auto}
.set-nav{width:220px;background:var(--card);border-radius:var(--r);padding:8px;display:flex;flex-direction:column;gap:4px;flex:none}
.set-nav button{background:none;border:0;text-align:left;padding:10px 14px;border-radius:12px;cursor:pointer;font-weight:500}
.set-nav button.on{background:var(--acs);color:var(--ac)}
.set-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:12px;padding-bottom:100px}
.card{background:var(--card);border-radius:var(--r);padding:16px;width:100%}
.card h2{margin:0 0 8px;font-size:16px}.card p{margin:6px 0;color:var(--mut)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row.end{justify-content:flex-end;margin-top:14px}
.row>*{flex:0 1 auto}.grow{flex:1 1 160px!important}
details summary{cursor:pointer;padding:6px 0}details p{color:var(--mut)}
/* nav */
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));width:min(92vw,440px);display:flex;gap:4px;padding:6px;border-radius:999px;background:color-mix(in srgb,var(--card) 82%,transparent);-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);box-shadow:0 8px 28px rgba(0,0,0,.18),0 0 0 1px var(--bd);z-index:5}
nav button{flex:1;background:none;border:0;border-radius:999px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:1px;font-size:11px;cursor:pointer;padding:7px 4px;transition:background .25s,color .25s}
nav .pill{display:grid;place-items:center}
nav svg{width:22px;height:22px;fill:currentColor}
nav button.on{background:var(--acs);color:var(--ac);font-weight:600}
@media(max-width:819px){body.inchat nav{display:none}#v-set{flex-direction:column;padding-bottom:110px}.set-nav{width:100%;flex-direction:row;overflow:auto}}
@media(min-width:820px){#app main{margin-bottom:92px}nav{width:460px;bottom:16px}}
dialog{border:0;border-radius:28px;background:var(--card);color:var(--tx);padding:20px;width:min(460px,92vw)}
dialog::backdrop{background:rgba(0,0,0,.45)}dialog h3{margin:0 0 10px}dialog p{color:var(--mut);margin:6px 0}
.mono{font-family:ui-monospace,Consolas,monospace;font-size:13px;word-break:break-all}
#toasts{position:fixed;left:0;right:0;bottom:calc(84px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;z-index:9}
.toast{background:#263130;color:#fff;border-radius:16px;padding:10px 16px;pointer-events:auto;max-width:92vw;display:flex;gap:12px;align-items:center}
.toast button{background:none;border:0;color:#7fe3d8;cursor:pointer}
@media(min-width:820px){#list{width:360px;flex:none;border-right:1px solid var(--bd)}#chat{display:flex}#v-chats.open #list{display:flex}.bk{display:none!important}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

[data-theme=dark][data-ac=blue]{--acs:#1b2e4a;--out:#1d3a63}[data-theme=dark][data-ac=purple]{--acs:#2b2347;--out:#3a2f66}[data-theme=dark][data-ac=rose]{--acs:#47202f;--out:#5e2a3f}[data-theme=dark][data-ac=amber]{--acs:#433116;--out:#5a431c}[data-theme=dark][data-ac=green]{--acs:#1a3b25;--out:#1f4d30}
html[data-fs=s] body{font-size:13.5px}html[data-fs=l] body{font-size:17px}

.chips{display:flex;gap:6px;padding:0 12px 6px;overflow:auto}.chip{border:1px solid var(--bd);background:none;border-radius:999px;padding:4px 12px;cursor:pointer;white-space:nowrap;font-size:13px}.chip.on{background:var(--acs);border-color:var(--ac)}
.av img{width:100%;height:100%;border-radius:50%;object-fit:cover}.av.ring{box-shadow:0 0 0 3px var(--card),0 0 0 5px var(--ac)}.av.ring.seen{box-shadow:0 0 0 3px var(--card),0 0 0 5px var(--mut)}
.q{border-left:3px solid var(--ac);background:rgba(127,127,127,.12);border-radius:8px;padding:4px 8px;margin-bottom:4px;font-size:13px}.q b{display:block;color:var(--ac)}.q span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--mut)}
.rc{position:absolute;bottom:-12px;right:10px;background:var(--card);border:1px solid var(--bd);border-radius:999px;padding:0 6px;font-size:13px}.m.hr{margin-bottom:12px}
#rb{display:none;align-items:center;gap:8px;padding:6px 12px;background:var(--card);border-top:1px solid var(--bd)}#rb .q{flex:1;margin:0;min-width:0}
#em{display:none;padding:8px 10px;background:var(--card);border-top:1px solid var(--bd);max-height:250px;overflow:auto}
.ov{position:fixed;inset:0;background:#000e;z-index:20;display:flex;flex-direction:column;color:#fff}.ov .sc{flex:1;display:grid;place-items:center;align-content:center;padding:24px;text-align:center;font-size:26px;min-height:0}.ov .sc img{max-width:100%;max-height:70vh;border-radius:12px}
.pb{display:flex;gap:4px;padding:10px}.pb i{flex:1;height:3px;border-radius:3px;background:#fff5}.pb i.d{background:#fff}.ov .tp{display:flex;justify-content:space-between;align-items:center;padding:6px 12px;gap:8px}.ov .ib{color:#fff}
.sw{display:flex;gap:8px;flex-wrap:wrap}.sw button{width:32px;height:32px;border-radius:50%;border:2px solid transparent;cursor:pointer}.sw button.on{border-color:var(--tx)}
.star{color:#e0a800}.del{font-style:italic;color:var(--mut)}.mt .ed{font-style:italic}

.dsep{align-self:center;background:var(--card);color:var(--mut);font-size:12px;border-radius:999px;padding:2px 12px;margin:6px 0}
.m a{color:var(--ac)}.fw{font-size:12px;color:var(--mut);font-style:italic}

.m.nb{background:none;padding:0}.stk{width:var(--stk,150px);height:var(--stk,150px);object-fit:contain;display:block}.tx.big{font-size:44px;line-height:1.1}
#mic.rec{color:#fff;background:var(--err)}
.sg{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:6px;margin-top:8px}.sg img{width:100%;aspect-ratio:1;object-fit:contain;cursor:pointer;border-radius:10px;background:var(--bg)}.sg .it{position:relative}.sg .it b{position:absolute;top:0;right:0;background:var(--card);border-radius:50%;width:20px;height:20px;text-align:center;cursor:pointer;font-weight:400;line-height:20px}
#v-posts{overflow:auto;padding:12px 12px 110px;flex-direction:column;align-items:center}.pw{width:100%;max-width:640px;display:flex;flex-direction:column;gap:12px}
.pc{background:var(--card);border-radius:var(--r);padding:14px}.pc img.pi{max-width:100%;border-radius:14px;margin-top:8px;display:block}.pc .row{margin-top:8px}

<div id="app">
<main>
 <section class="view on" id="v-chats">
  <div id="list">
   <div class="hd"><h1>SyncBee</h1><button class="ib" id="addb" aria-label="Add contact"></button></div>
   <div class="sig" id="sigl">Connection service: starting…</div>
   <a href="help.html" class="help-pill">New to SyncBee? Learn how to connect, chat, and share files.</a>
   <div class="tabs" role="tablist">
    <button data-t="chats" class="on">Chats</button>
    <button data-t="unread">Unread</button>
    <button data-t="fav">Favorites</button>
    <button data-t="arch">Archived</button>
    <button data-t="groups">Groups</button>
    <button data-t="communities">Communities</button>
    <button data-t="status">Status</button>
   </div>
   <input id="sq" type="search" placeholder="Search chats or username (@)" aria-label="Search chats">
   <div id="cl"></div>
   <div id="stp" style="display:none;flex:1;overflow:auto;padding:4px 12px"></div>
  </div>
  <div id="chat">
   <div id="emp"><h2>Connect. Chat. Share.</h2><p>Pick a chat, or add a contact once and SyncBee will reconnect to them automatically afterwards.</p></div>
   <div id="cc">
    <div class="hd" id="ch">
     <button class="ib bk" id="bkb" aria-label="Back to chats"></button>
     <div class="av" id="cav"></div>
     <div class="nm"><b id="cn"></b><span id="cst"></span></div>
     <button class="ib" id="rcb" aria-label="Reconnect" title="Reconnect"></button>
     <button class="ib" id="srb" aria-label="Search in conversation"></button>
     <button class="ib" id="mnb" aria-label="Contact options"></button>
     <div class="dropdown" id="chat-dropdown">
      <button id="dd-info">Contact info</button>
      <button id="dd-pin">Pin chat</button>
      <button id="dd-mute">Mute notifications</button>
      <button id="dd-clear" class="danger">Clear chat</button>
      <button id="dd-block" class="danger">Block contact</button>
     </div>
    </div>
    <input id="cs" type="search" placeholder="Search in conversation" aria-label="Search in conversation">
    <div id="msgs" role="log" aria-live="polite"></div>
    <div id="rb"></div><div id="em"></div>
    <div id="cp">
     <button class="ib" id="atb" aria-label="Attach files"></button>
     <button class="ib" id="emb" aria-label="Emoji">😊</button>
     <textarea id="inp" rows="1" placeholder="Message" aria-label="Message"></textarea>
     <button class="ib" id="mic" aria-label="Voice note"></button>
     <button class="ib" id="snb" aria-label="Send"></button>
     <input type="file" id="fi" multiple hidden>
    </div>
   </div>
  </div>
 </section>
 <section class="view" id="v-set">
  <div class="set-nav" role="tablist">
   <button class="on" data-s="profile">Profile & Account</button>
   <button data-s="chats">Chats & Display</button>
   <button data-s="notif">Notifications</button>
   <button data-s="status">Status & Posts</button>
   <button data-s="privacy">Privacy & Security</button>
   <button data-s="media">Media & Voice</button>
   <button data-s="connection">Connection & Relay</button>
   <button data-s="storage">Storage & Backup</button>
   <button data-s="help">Help & About</button>
  </div>
  <div class="set-body" id="set-content"></div>
 </section>
 <section class="view" id="v-posts"></section>
</main>
<nav aria-label="Main">
 <button data-v="chats" class="on"><span class="pill" data-i="chat"></span>Chats</button>
 <button data-v="posts"><span class="pill" data-i="post"></span>Posts</button>
 <button data-v="util"><span class="pill" data-i="grid"></span>UtiliX</button>
 <button data-v="set"><span class="pill" data-i="tune"></span>Settings</button>
</nav>
</div>

  }

 $('#cn').textContent=ct.name+(ct.username?' @'+ct.username:'');$('#cav').replaceChildren(ct.av?h('img',{src:ct.av,alt:''}):initial(ct.name));
 $('#cst').textContent=typingNow(ct.id)?'typing…':st;
 $('#rcb').style.display=self||L.state==='online'||ct.isGroup?'none':''}
async function openChat(id){S.cur=id;S.q='';$('#cs').value='';revoke();S.reply=S.edit=null;showRb();purge();const ct=S.cs.get(id);ct.unread=0;saveC(ct);
 S.msgs=(await dbChat(id)).sort((a,b)=>a.ts-b.ts);
 $('#chat').classList.add('has');$('#v-chats').classList.add('open');renderHead();renderMsgs();renderList();$('#inp').focus({preventScroll:true});syncNav();sendRead(id)}
function renderMsgs(){const q=S.q.toLowerCase(),a=S.msgs.filter(m=>!q||(m.txt||'').toLowerCase().includes(q)||(m.file&&m.file.name.toLowerCase().includes(q)));
 const box=$('#msgs'),nodes=[];let pd='';for(const m of a){const dk=new Date(m.ts).toDateString();if(dk!==pd){pd=dk;nodes.push(dsep(m.ts))}nodes.push(bubble(m))}box.replaceChildren(...nodes);
 if(!a.length)box.append(h('div',{class:'empty'},q?'No matching messages.':'No messages yet.'));
 box.scrollTop=box.scrollHeight}
function appendB(m){const b=$('#msgs');b.querySelector('.empty')?.remove();const pv=S.msgs[S.msgs.length-2];if(!pv||new Date(pv.ts).toDateString()!==new Date(m.ts).toDateString())b.append(dsep(m.ts));b.append(bubble(m));if(S.prefs.asc)b.scrollTop=b.scrollHeight}
const STM={local:'Saved locally',sent:'Sent',acked:'Confirmed',failed:'Failed',read:'Read',recv:''};
function bubble(m){const out=m.dir==='out',b=h('div',{class:'m '+(out?'out':'in')+(m.rx&&(m.rx.me||m.rx.them)?' hr':''),'data-id':m.id,tabindex:0});
 if(m.del)b.append(h('div',{class:'del'},'🚫 This message was deleted'));else if(m.re)b.append(h('div',{class:'q'},h('b',{},m.re.who==='me'?'You':'Contact'),h('span',{},m.re.t)));
 if(m.fw&&!m.del)b.append(h('div',{class:'fw'},'↪ Forwarded'));
 if(m.del){}else if(m.file){
  const f=m.file,run=['sending','receiving','queued'].includes(m.st),box=h('div',{class:'file'});
  if(IMG.includes(f.type)&&f.size<2e7){const img=h('img',{class:'pv',alt:f.name});getBlob(m).then(bl=>{if(bl&&b.isConnected)img.src=urlOf(m.id,bl)});box.append(img)}
  box.append(h('div',{class:'fn'},'📎 '+f.name),h('div',{class:'fs'},fmtB(f.size)+(f.type?' · '+f.type:'')));
  if(m.st==='done'){box.append(h('button',{class:'lnk',onclick:()=>dl(m)},'Download'));}
  b.append(box);
 }else if(m.stk){b.append(h('img',{class:'stk',src:m.stk,alt:'Sticker'}));b.classList.add('nb')}
 else{
  if(m.txt&&m.txt.startsWith('http')){const u=m.txt;b.append(h('div',{class:'preview-box'},h('a',{href:u,target:'_blank',rel:'noopener'},u)));}
  b.append(h('div',{class:'tx'+(S.prefs.big&&EMO.test((m.txt||'').trim())?' big':'')},linkify(m.txt)));
 }
 const rx=m.rx?[m.rx.me,m.rx.them].filter(Boolean).join(''):'';if(rx)b.append(h('span',{class:'rc'},rx));
 b.append(h('div',{class:'mt'},m.star?h('span',{class:'star'},'★'):null,S.prefs.ts?fmtT(m.ts):'',out&&m.chat!=='self'?STM[m.st]:'',h('button',{class:'mb',onclick:()=>msgDropdown(m)},'⋮')));
 return b}
function refresh(m){if(S.cur!==m.chat)return;const e=$('#msgs').querySelector('[data-id="'+CSS.escape(m.id)+'"]');if(e)e.replaceWith(bubble(m))}
async function msgDropdown(m){
 const action=await modal('Message options',h('p',{},'Choose action for message'),[['Reply','rp'],m.txt?['Copy','cp']:['',''],[m.star?'Unstar':'Star','st'],['Delete for me','dm','danger']].filter(x=>x[0]));
 if(action==='rp'){S.reply=m;showRb();$('#inp').focus()}
 if(action==='cp')navigator.clipboard.writeText(m.txt);
 if(action==='st')upd(m,{star:!m.star});
 if(action==='dm'){await dbDel('msgs',m.id);S.msgs=S.msgs.filter(x=>x!==m);renderMsgs()}
}
async function upd(m,p){Object.assign(m,p);await saveM(m);refresh(m)}
async function tomb(m){await upd(m,{txt:'',del:1,file:null,re:null,rx:null,star:false})}
async function loc(peer,mid,dir){const key=dir==='out'?mid:peer+':'+mid;return await dbGet('msgs',key)}
function showRb(){const r=$('#rb'),m=S.reply||S.edit;if(!m){r.style.display='none';return}r.style.display='flex';r.replaceChildren(h('div',{class:'q'},h('b',{},'Replying'),h('span',{},snip(m))),h('button',{class:'ib',onclick:()=>{S.reply=S.edit=null;showRb()}},'✕'))}
/* ---------- sending ---------- */
async function sendMsg(){const t=$('#inp').value.trim();if(!t||!S.cur)return;$('#inp').value='';autosize();$('#em').style.display='none';
 const m={id:rnd(16),chat:S.cur,dir:'out',ts:Date.now(),txt:t,st:S.cur==='self'?'note':'local'};
 if(S.reply){m.re={t:snip(S.reply).slice(0,100),who:S.reply.dir==='out'?'me':'them'};S.reply=null;showRb()}
 S.msgs.push(m);await saveM(m);appendB(m);touch(S.cs.get(S.cur),m);if(S.cur!=='self')sendText(m)}
function autosize(){const i=$('#inp');i.style.height='auto';i.style.height=Math.min(120,i.scrollHeight)+'px'}
/* ---------- file transfer & Drag and Drop ---------- */
const wait=(x,ms)=>new Promise(r=>{const t=setTimeout(()=>{x.w=null;r(null)},ms);x.w=d=>{clearTimeout(t);x.w=null;r(d)}});
async function queueFiles(files){const id=S.cur,L=lk(id);if(id==='self')return toast('Cannot send files in Notes.');
 for(const f of files){
  const m={id:rnd(16),chat:id,dir:'out',ts:Date.now(),file:{name:f.name,type:f.type,size:f.size},st:'done'};
  await safe(dbPut('blobs',f,m.id));
  S.msgs.push(m);await saveM(m);appendB(m);touch(S.cs.get(id),m);
  const c=L.conn;if(c&&c.open)c.send({v:1,t:'msg',id:m.id,txt:'[File: '+f.name+']'});
 }}
async function dl(m){const b=await getBlob(m);if(!b)return toast('File not found.');const u=URL.createObjectURL(b),a=h('a',{href:u,download:m.file.name});document.body.append(a);a.click();a.remove()}

// Drag and drop listener for PC
window.addEventListener('dragover',e=>e.preventDefault());
window.addEventListener('drop',e=>{
 e.preventDefault();
 if(e.dataTransfer.files&&e.dataTransfer.files.length&&S.cur){queueFiles([...e.dataTransfer.files])}
});

/* ---------- contact actions & dropdowns ---------- */
$('#mnb').onclick=()=>{$('#chat-dropdown').classList.toggle('open')};
$('#dd-info').onclick=()=>{$('#chat-dropdown').classList.remove('open');contactMenu(S.cur)};
$('#dd-pin').onclick=()=>{$('#chat-dropdown').classList.remove('open');const ct=S.cs.get(S.cur);ct.pin=!ct.pin;saveC(ct);renderList()};
$('#dd-mute').onclick=()=>{$('#chat-dropdown').classList.remove('open');const ct=S.cs.get(S.cur);ct.mute=!ct.mute;saveC(ct);renderList()};
$('#dd-clear').onclick=async()=>{$('#chat-dropdown').classList.remove('open');if(await confirmM('Clear chat?','Delete messages?','Clear',1)){await delChat(S.cur);S.msgs=[];renderMsgs()}};
$('#dd-block').onclick=async()=>{$('#chat-dropdown').classList.remove('open');const ct=S.cs.get(S.cur);ct.blocked=!ct.blocked;saveC(ct);renderList()};

async function contactMenu(id){const ct=S.cs.get(id);if(!ct)return;
 await modal(ct.name,h('div',{},h('p',{},'Device ID: '+id),h('p',{},'Username: @'+(ct.username||'none'))),[['Close','no']])}

async function addDialog(){const inp=h('input',{placeholder:'Paste invite code','aria-label':'Code'});
 const qrBox=h('div',{style:'text-align:center;margin-top:12px'},h('p',{},'Your QR Code to connect quickly:'),h('div',{innerHTML:makeQRCodeSVG(makeInvite())}));
 const mk=h('button',{class:'btn',onclick:()=>{const code=makeInvite();navigator.clipboard.writeText(code);toast('Invite code copied to clipboard!')}},'Copy Invite Code');
 const v=await modal('Connect Devices',h('div',{},mk,qrBox,h('p',{},'Or enter invite code:'),inp),[['Cancel','no'],['Join','go','pri']]);
 if(v==='go'&&inp.value.trim())join(inp.value)}

/* ---------- settings with vertical tabs ---------- */
const SET_TABS=[['profile','Profile & Account'],['chats','Chats & Display'],['notif','Notifications'],['status','Status & Posts'],['privacy','Privacy & Security'],['media','Media & Voice'],['connection','Connection & Relay'],['storage','Storage & Backup'],['help','Help & About']];
function renderSet(){
 const body=$('#set-content');
 document.querySelectorAll('.set-nav button').forEach(b=>b.classList.toggle('on',b.dataset.s===S.setTab));
 const sec=(t,...c)=>h('div',{class:'card'},h('h2',{},t),...c);
 const tg=(l,k)=>h('label',{class:'row'},h('input',{type:'checkbox',style:'width:auto',checked:S.prefs[k],onchange:e=>{S.prefs[k]=e.target.checked;savePrefs()}}),l);
 
 if(S.setTab==='profile'){
  body.replaceChildren(
   sec('Profile',h('div',{class:'row'},avEl(S.me.name,S.me.av),h('div',{class:'grow'},h('b',{},S.me.name),h('p',{},'@'+S.me.username))),
    h('div',{class:'row'},h('button',{class:'btn',onclick:async()=>{const n=await ask('Name','Name',S.me.name);if(n)saveProf({name:n})}},'Change Name'),h('button',{class:'btn',onclick:async()=>{const u=await ask('Username (@)','Username',S.me.username);if(u)saveProf({username:u.replace(/^@/,'')})}},'Set Username (@)'))),
   sec('Multiple Logins',h('p',{},'Sync your account across multiple devices using your unique username (@'+(S.me.username||'example')+').'))
  );
 } else if(S.setTab==='chats'){
  body.replaceChildren(
   sec('Appearance',h('select',{'aria-label':'Theme',onchange:e=>{S.prefs.theme=e.target.value;savePrefs();theme()}},['system','light','dark'].map(t=>h('option',{value:t,selected:S.prefs.theme===t},t))),
    h('div',{class:'sw'},['teal','blue','purple','rose','amber','green'].map(k=>h('button',{class:S.prefs.ac===k?'on':'',style:'background:'+({'teal':'#0f9d8f','blue':'#2f7de1','purple':'#7c5cd6','rose':'#d6457a','amber':'#d98a1c','green':'#2e9b4f'}[k]),onclick:()=>{S.prefs.ac=k;savePrefs();theme();renderSet()}})))),
   sec('Chat Settings',tg('Enter key sends message','enter'),tg('24-hour clock','h24'))
  );
 } else if(S.setTab==='notif'){
  body.replaceChildren(sec('Notifications',tg('Enable notifications','notif'),tg('Message sound','snd'),tg('Vibration','vib')));
 } else if(S.setTab==='status'){
  body.replaceChildren(sec('Status & Posts',h('button',{class:'btn',onclick:publicDialog},'🌐 Toggle Public Status'),tg('Allow likes on posts','likes')));
 } else if(S.setTab==='privacy'){
  body.replaceChildren(sec('Privacy',tg('Read receipts','rcpt'),tg('Typing indicator','typ')));
 } else if(S.setTab==='media'){
  body.replaceChildren(sec('Media',tg('Voice notes','vn'),tg('Data saver','saver')));
 } else if(S.setTab==='connection'){
  body.replaceChildren(sec('Connection',h('button',{class:'btn',onclick:startPeer},'Restart Connection Service')));
 } else if(S.setTab==='storage'){
  body.replaceChildren(sec('Storage',h('button',{class:'btn',onclick:exportB},'Export Backup'),h('button',{class:'btn',onclick:clearHist},'Clear History')));
 } else {
  body.replaceChildren(sec('About SyncBee',h('p',{},'SyncBee v'+VER+' · Connect. Chat. Share.'),h('a',{href:'help.html',class:'lnk'},'Open Full Help Guide')));
 }
}
document.querySelectorAll('.set-nav button').forEach(b=>b.onclick=()=>{S.setTab=b.dataset.s;renderSet()});

const savePrefs=()=>safe(dbPut('kv',S.prefs,'prefs'));
async function saveProf(p){Object.assign(S.me,p);await safe(dbPut('kv',S.me,'me'));renderSet()}
async function exportB(){const d={app:'syncbee',v:2,me:S.me,contacts:[...S.cs.values()],msgs:await dbAll('msgs')},u=URL.createObjectURL(new Blob([JSON.stringify(d)],{type:'application/json'})),a=h('a',{href:u,download:'syncbee-backup.json'});document.body.append(a);a.click();a.remove()}
async function clearHist(){if(await confirmM('Clear history?','Delete all messages?','Clear',1)){await IO('msgs','readwrite',o=>o.clear());S.msgs=[];renderMsgs()}}

/* ---------- navigation & tabs ---------- */
function go(v){if(v==='util'){location.href=UTIL;return}S.view=v;$('#v-chats').classList.toggle('on',v==='chats');$('#v-set').classList.toggle('on',v==='set');$('#v-posts').classList.toggle('on',v==='posts');document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));if(v==='set')renderSet();if(v==='posts')renderPosts();syncNav()}
const syncNav=()=>document.body.classList.toggle('inchat',S.view==='chats'&&$('#v-chats').classList.contains('open'));
document.querySelectorAll('[data-i]').forEach(e=>e.append(ic(e.dataset.i)));
for(const [i,n] of [['#addb','add'],['#bkb','back'],['#rcb','refresh'],['#srb','search'],['#mnb','more'],['#atb','attach'],['#mic','mic'],['#snb','send']])$(i).append(ic(n));
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>go(b.dataset.v));
$('#addb').onclick=()=>S.tab==='status'?addStatus():addDialog();$('#sq').oninput=renderList;
$('#bkb').onclick=()=>{$('#v-chats').classList.remove('open');S.cur=null;$('#chat').classList.remove('has');renderList();syncNav()};
$('#rcb').onclick=()=>{kick(S.cur,true,true);toast('Reconnecting…')};
$('#srb').onclick=()=>{const s=$('#cs');s.style.display=s.style.display==='block'?'none':'block';if(s.style.display==='block')s.focus()};
$('#cs').oninput=e=>{S.q=e.target.value;renderMsgs()};
$('#snb').onclick=sendMsg;$('#inp').oninput=autosize;$('#inp').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMsg()}};
$('#atb').onclick=()=>$('#fi').click();$('#fi').onchange=e=>{queueFiles([...e.target.files]);e.target.value=''};

/* ---------- status & posts & groups ---------- */
const stSave=()=>safe(dbPut('kv',S.sts,'st')),poSave=()=>safe(dbPut('kv',S.posts,'po'));
function stAllowed(){return true} function poAllowed(){return true}
function stSendTo(){ } function poSendTo(){ } function plSync(){ }
function onSt(){ } function onPo(){ }

function renderStatus(){}

document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>setTab(b.dataset.t));
$('#emb').onclick=()=>{const e=$('#em');e.style.display=e.style.display==='block'?'none':'block';if(e.style.display==='block')e.replaceChildren(h('div',{class:'tabs'},['😀','😂','❤️','👍','🔥'].map(em=>h('button',{class:'ib',style:'font-size:20px',onclick:()=>{const i=$('#inp');i.value+=em;autosize()}},em))))};

/* ---------- boot ---------- */
(async()=>{
 try{
  S.me=await dbGet('kv','me');const pr=await dbGet('kv','prefs');if(pr)Object.assign(S.prefs,pr);
  for(const c of await dbAll('contacts'))S.cs.set(c.id,c);
  S.lock=await dbGet('kv','lock');
 }catch{}
 if(!S.cs.has('self')){const s={id:'self',name:'Notes',local:true,unread:0};S.cs.set('self',s);await saveC(s)}
 // Default group: MirCodeStudio Team
 if(!S.cs.has('group-mircodestudio-team')){
  const g={id:'group-mircodestudio-team',name:'MirCodeStudio Team',isGroup:true,host:'MirCodeStudio',cannotLeave:true,unread:0,created:Date.now()};
  S.cs.set(g.id,g);await saveC(g);
 }
 if(!S.me){S.me={id:'sync-'+rnd(20),name:'User',username:'user'+rnd(4)};await saveP();}
 async function saveP(){await safe(dbPut('kv',S.me,'me'))}
 if(!S.me.name){S.me.name=await ask('Welcome to SyncBee','Your name','')||'User';await saveP()}
 if(!S.me.username){S.me.username='user'+rnd(4);await saveP()}
 S.view='chats';renderList();syncNav();
 // Manifest creation with icon.png
 const mBlob=new Blob([JSON.stringify({name:"SyncBee",short_name:"SyncBee",start_url:".",display:"standalone",background_color:"#0f9d8f",theme_color:"#0f9d8f",icons:[{src:"icon.png",sizes:"192x192 512x512",type:"image/png"}]})],{type:'application/json'});
 document.querySelector('link[rel="manifest"]').href=URL.createObjectURL(mBlob);
 startPeer();
})();
