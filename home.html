<style>
:root{--bg:#f3f6f5;--card:#fff;--tx:#17201f;--mut:#617370;--ac:#0f9d8f;--acs:#d6f1ed;--out:#c8eee8;--in:#fff;--bd:#e0e8e6;--err:#d64545;--warn:#c9821a;--ok:#1d9b57;--r:20px}

*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font:15px/1.4 system-ui,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);overflow:hidden}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
#app{height:100dvh;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}

.view{position:absolute;inset:0;display:none}.view.on{display:flex}
.ib{background:none;border:0;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;cursor:pointer;color:var(--tx)}
.ib:hover{background:var(--acs)}.ib svg{width:24px;height:24px;fill:currentColor}
.btn{border:0;border-radius:999px;padding:10px 18px;cursor:pointer;background:var(--acs);color:var(--tx);min-height:44px}
.btn.pri{background:var(--ac);color:#fff}.btn.danger{background:var(--err);color:#fff}
.lnk{background:none;border:0;color:var(--ac);cursor:pointer;padding:6px 0;text-decoration:underline}
input,textarea,select{background:var(--bg);border:1px solid var(--bd);border-radius:14px;padding:10px 14px;width:100%}
/* chats */
#list{width:100%;display:flex;flex-direction:column;background:var(--card);min-width:0}
.hd{display:flex;align-items:center;gap:8px;padding:10px 12px;min-height:60px}
.hd h1{font-size:22px;margin:0;flex:1}
.sig{font-size:12px;color:var(--mut)}
#sq{margin:0 12px 8px;width:auto}
#cl{flex:1;overflow:auto;padding:4px 8px}
.ci{display:flex;gap:12px;align-items:center;padding:10px;border-radius:var(--r);cursor:pointer;width:100%;background:none;border:0;text-align:left}
.ci:hover,.ci.sel{background:var(--acs)}
.av{width:48px;height:48px;border-radius:50%;background:var(--ac);color:#fff;display:grid;place-items:center;font-weight:600;position:relative;flex:none}
.av i{position:absolute;right:0;bottom:0;width:13px;height:13px;border-radius:50%;border:2px solid var(--card);background:var(--mut)}
.av i.online{background:var(--ok)}.av i.connecting,.av i.reconnecting{background:var(--warn)}.av i.failed{background:var(--err)}
.cm{flex:1;min-width:0}.cm b,.cm span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cm span{color:var(--mut);font-size:13px}.ct{font-size:12px;color:var(--mut);text-align:right}
.bg{background:var(--ac);color:#fff;border-radius:999px;font-size:12px;padding:1px 7px;display:inline-block;margin-top:3px}
#chat{display:none;flex:1;flex-direction:column;min-width:0}
#v-chats.open #list{display:none}#v-chats.open #chat{display:flex}
#emp,.empty{margin:auto;text-align:center;color:var(--mut);padding:24px;max-width:340px}
#cc{display:none;flex-direction:column;flex:1;min-height:0}
#chat.has #cc{display:flex}#chat.has #emp{display:none}
#ch{background:var(--card);border-bottom:1px solid var(--bd)}
#ch .nm{flex:1;min-width:0}#ch .nm b,#ch .nm span{display:block;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#ch .nm span{font-size:12px;color:var(--mut)}
#cs{display:none;margin:6px 12px}
#msgs{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:6px}
.m{max-width:min(78%,560px);padding:8px 12px;border-radius:18px;position:relative;word-wrap:break-word;overflow-wrap:anywhere}
.m.in{background:var(--in);align-self:flex-start;border-bottom-left-radius:6px}
.m.out{background:var(--out);align-self:flex-end;border-bottom-right-radius:6px}
.m .tx{white-space:pre-wrap}.m .mt{font-size:11px;color:var(--mut);margin-top:2px;display:flex;gap:6px;align-items:center;justify-content:flex-end}
.m .mb{background:none;border:0;color:var(--mut);cursor:pointer;padding:0 4px}
.file .fn{font-weight:600}.file .fs{font-size:12px;color:var(--mut)}.file .err,.m .er{color:var(--err)}
.bar{height:6px;background:var(--bd);border-radius:6px;overflow:hidden;margin:6px 0;min-width:180px}.bar i{display:block;height:100%;background:var(--ac)}
.pv{max-width:100%;max-height:260px;border-radius:12px;margin-top:6px;display:block}
#cp{display:flex;gap:6px;align-items:flex-end;padding:8px 10px calc(8px);background:var(--card);border-top:1px solid var(--bd)}
#cp textarea{resize:none;max-height:120px;border-radius:22px}
/* settings */
#v-set{overflow:auto;padding:12px;flex-direction:column;gap:12px;align-items:center}
.card{background:var(--card);border-radius:var(--r);padding:16px;width:100%;max-width:720px}
.card h2{margin:0 0 8px;font-size:16px}.card p{margin:6px 0;color:var(--mut)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row.end{justify-content:flex-end;margin-top:14px}
.row>*{flex:0 1 auto}.grow{flex:1 1 160px!important}
details summary{cursor:pointer;padding:6px 0}details p{color:var(--mut)}
/* nav */
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));width:min(92vw,440px);display:flex;gap:4px;padding:6px;border-radius:999px;background:color-mix(in srgb,var(--card) 82%,transparent);-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);box-shadow:0 8px 28px rgba(0,0,0,.18),0 0 0 1px var(--bd);z-index:5}
nav button{flex:1;background:none;border:0;border-radius:999px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:1px;font-size:11px;cursor:pointer;padding:7px 4px;transition:background .25s,color .25s}
nav .pill{display:grid;place-items:center}
nav svg{width:22px;height:22px;fill:currentColor}
nav button.on{background:var(--acs);color:var(--ac);font-weight:600}
@media(max-width:819px){body.inchat nav{display:none}}
@media(min-width:820px){#app main{margin-bottom:92px}nav{width:460px;bottom:16px}}
dialog{border:0;border-radius:28px;background:var(--card);color:var(--tx);padding:20px;width:min(460px,92vw)}
dialog::backdrop{background:rgba(0,0,0,.45)}dialog h3{margin:0 0 10px}dialog p{color:var(--mut);margin:6px 0}
.mono{font-family:ui-monospace,Consolas,monospace;font-size:13px;word-break:break-all}
#toasts{position:fixed;left:0;right:0;bottom:calc(84px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;z-index:9}
.toast{background:#263130;color:#fff;border-radius:16px;padding:10px 16px;pointer-events:auto;max-width:92vw;display:flex;gap:12px;align-items:center}
.toast button{background:none;border:0;color:#7fe3d8;cursor:pointer}
@media(min-width:820px){#list{width:360px;flex:none;border-right:1px solid var(--bd)}#chat{display:flex}#v-chats.open #list{display:flex}.bk{display:none!important}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

.chips{display:flex;gap:6px;padding:0 12px 6px;overflow:auto}.chip{border:1px solid var(--bd);background:none;border-radius:999px;padding:4px 12px;cursor:pointer;white-space:nowrap}.chip.on{background:var(--acs);border-color:var(--ac)}

.rc{position:absolute;bottom:-12px;right:10px;background:var(--card);border:1px solid var(--bd);border-radius:999px;padding:0 6px;font-size:13px}.m.hr{margin-bottom:12px}

function mkStk(t,e,c){try{const cv=document.createElement('canvas');cv.width=cv.height=256;const x=cv.getContext('2d');x.fillStyle=c;x.beginPath();if(x.roundRect)x.roundRect(8,8,240,240,48);else x.rect(8,8,240,240);x.fill();x.textAlign='center';x.textBaseline='middle';x.font='110px system-ui,"Segoe UI Emoji","Apple Color Emoji",sans-serif';x.fillText(e,128,108);x.fillStyle='#fff';x.font='bold 40px system-ui,sans-serif';x.fillText(t.slice(0,12),128,206);const o=cv.toDataURL('image/webp',.85);return o.length<130000?o:null}catch{return null}}
async function stkFrom(f){try{const bm=await createImageBitmap(f);for(const z of [256,192,128]){const cv=document.createElement('canvas'),r=Math.min(z/bm.width,z/bm.height);cv.width=Math.max(1,Math.round(bm.width*r));cv.height=Math.max(1,Math.round(bm.height*r));cv.getContext('2d').drawImage(bm,0,0,cv.width,cv.height);const o=cv.toDataURL('image/webp',S.prefs.saver?.6:.85);if(o.length<130000)return o}}catch{}return null}
