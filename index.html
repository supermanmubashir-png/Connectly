<style>
:root{--bg:#f3f6f5;--card:#fff;--tx:#17201f;--mut:#617370;--ac:#0f9d8f;--acs:#d6f1ed;--out:#c8eee8;--in:#fff;--bd:#e0e8e6;--err:#d64545;--warn:#c9821a;--ok:#1d9b57;--r:20px}
[data-theme=dark]{--bg:#0e1413;--card:#172120;--tx:#e8f0ef;--mut:#8da09d;--acs:#1b3b37;--out:#1b4943;--in:#202c2b;--bd:#2a3837}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font:15px/1.4 system-ui,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);overflow:hidden}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
#app{height:100dvh;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
main{flex:1;min-height:0;position:relative}
.view{position:absolute;inset:0;display:none}.view.on{display:flex}
.ib{background:none;border:0;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;cursor:pointer;color:var(--tx)}
.ib:hover{background:var(--acs)}.ib svg{width:24px;height:24px;fill:currentColor}
.btn{border:0;border-radius:999px;padding:10px 18px;cursor:pointer;background:var(--acs);color:var(--tx);min-height:44px}
.btn.pri{background:var(--ac);color:#fff}.btn.danger{background:var(--err);color:#fff}
.lnk{background:none;border:0;color:var(--ac);cursor:pointer;padding:6px 0;text-decoration:underline}
input,textarea,select{background:var(--bg);border:1px solid var(--bd);border-radius:14px;padding:10px 14px;width:100%}
/* chats */
#list{width:100%;display:flex;flex-direction:column;background:var(--card);min-width:0}
.hd{display:flex;align-items:center;gap:8px;padding:10px 12px;min-height:60px}
.hd h1{font-size:22px;margin:0;flex:1}
.sig{font-size:12px;color:var(--mut)}
#sq{margin:0 12px 8px;width:auto}
#cl{flex:1;overflow:auto;padding:4px 8px}
.ci{display:flex;gap:12px;align-items:center;padding:10px;border-radius:var(--r);cursor:pointer;width:100%;background:none;border:0;text-align:left}
.ci:hover,.ci.sel{background:var(--acs)}
.av{width:48px;height:48px;border-radius:50%;background:var(--ac);color:#fff;display:grid;place-items:center;font-weight:600;position:relative;flex:none}
.av i{position:absolute;right:0;bottom:0;width:13px;height:13px;border-radius:50%;border:2px solid var(--card);background:var(--mut)}
.av i.online{background:var(--ok)}.av i.connecting,.av i.reconnecting{background:var(--warn)}.av i.failed{background:var(--err)}
.cm{flex:1;min-width:0}.cm b,.cm span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cm span{color:var(--mut);font-size:13px}.ct{font-size:12px;color:var(--mut);text-align:right}
.bg{background:var(--ac);color:#fff;border-radius:999px;font-size:12px;padding:1px 7px;display:inline-block;margin-top:3px}
#chat{display:none;flex:1;flex-direction:column;min-width:0}
#v-chats.open #list{display:none}#v-chats.open #chat{display:flex}
#emp,.empty{margin:auto;text-align:center;color:var(--mut);padding:24px;max-width:340px}
#cc{display:none;flex-direction:column;flex:1;min-height:0}
#chat.has #cc{display:flex}#chat.has #emp{display:none}
#ch{background:var(--card);border-bottom:1px solid var(--bd)}
#ch .nm{flex:1;min-width:0}#ch .nm b,#ch .nm span{display:block;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#ch .nm span{font-size:12px;color:var(--mut)}
#cs{display:none;margin:6px 12px}
#msgs{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:6px}
.m{max-width:min(78%,560px);padding:8px 12px;border-radius:18px;position:relative;word-wrap:break-word;overflow-wrap:anywhere}
.m.in{background:var(--in);align-self:flex-start;border-bottom-left-radius:6px}
.m.out{background:var(--out);align-self:flex-end;border-bottom-right-radius:6px}
.m .tx{white-space:pre-wrap}.m .mt{font-size:11px;color:var(--mut);margin-top:2px;display:flex;gap:6px;align-items:center;justify-content:flex-end}
.m .mb{background:none;border:0;color:var(--mut);cursor:pointer;padding:0 4px}
.file .fn{font-weight:600}.file .fs{font-size:12px;color:var(--mut)}.file .err,.m .er{color:var(--err)}
.bar{height:6px;background:var(--bd);border-radius:6px;overflow:hidden;margin:6px 0;min-width:180px}.bar i{display:block;height:100%;background:var(--ac)}
.pv{max-width:100%;max-height:260px;border-radius:12px;margin-top:6px;display:block}
#cp{display:flex;gap:6px;align-items:flex-end;padding:8px 10px calc(8px);background:var(--card);border-top:1px solid var(--bd)}
#cp textarea{resize:none;max-height:120px;border-radius:22px}

.card{background:var(--card);border-radius:var(--r);padding:16px;width:100%;max-width:720px}
.card h2{margin:0 0 8px;font-size:16px}.card p{margin:6px 0;color:var(--mut)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row.end{justify-content:flex-end;margin-top:14px}
.row>*{flex:0 1 auto}.grow{flex:1 1 160px!important}
details summary{cursor:pointer;padding:6px 0}details p{color:var(--mut)}

nav .pill{width:64px;height:32px;border-radius:16px;display:grid;place-items:center;transition:background .2s}
nav svg{width:24px;height:24px;fill:currentColor}
nav button.on{color:var(--tx);font-weight:600}nav button.on .pill{background:var(--acs);color:var(--ac)}
dialog{border:0;border-radius:28px;background:var(--card);color:var(--tx);padding:20px;width:min(460px,92vw)}

.mono{font-family:ui-monospace,Consolas,monospace;font-size:13px;word-break:break-all}
#toasts{position:fixed;left:0;right:0;bottom:calc(84px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;z-index:9}
.toast{background:#263130;color:#fff;border-radius:16px;padding:10px 16px;pointer-events:auto;max-width:92vw;display:flex;gap:12px;align-items:center}
.toast button{background:none;border:0;color:#7fe3d8;cursor:pointer}
@media(min-width:820px){#list{width:360px;flex:none;border-right:1px solid var(--bd)}#chat{display:flex}#v-chats.open #list{display:flex}.bk{display:none!important}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

   <div id="cl"></div>
  </div>

     <button class="ib" id="snb" aria-label="Send"></button>

    </div>
   </div>
  </div>
 </section>
 <section class="view" id="v-set"></section>
</main>
<nav aria-label="Main">
 <button data-v="chats" class="on"><span class="pill" data-i="chat"></span>Chats</button>
 <button data-v="util"><span class="pill" data-i="grid"></span>UtiliX</button>
 <button data-v="set"><span class="pill" data-i="tune"></span>Settings</button>
</nav>
</div>
<div id="toasts" aria-live="polite"></div>

 sec('Files',h('div',{class:'row'},h('label',{class:'grow',for:'mx'},'Maximum file size (MB)'),h('input',{id:'mx',type:'number',min:1,max:2000,value:S.prefs.maxMB,style:'width:110px',onchange:e=>{S.prefs.maxMB=Math.max(1,Math.min(2000,+e.target.value||200));savePrefs()}})),
  h('label',{class:'row'},h('input',{type:'checkbox',style:'width:auto',checked:S.prefs.keep,onchange:e=>{S.prefs.keep=e.target.checked;savePrefs()}}),'Keep sent and received files on this device'),h('p',{},'Received files are held in memory until the transfer completes, so very large limits can exhaust RAM on phones.')),
 sec('Storage and backup',h('p',{},est?'Used '+fmtB(est.usage||0)+' of about '+fmtB(est.quota||0):'Usage unavailable'),h('p',{},'History lives only in this browser. Clearing browser data deletes it. Backups contain contact secrets; keep them private. Files are not included.'),
  h('div',{class:'row'},h('button',{class:'btn',onclick:exportB},'Export backup'),h('button',{class:'btn',onclick:()=>$('#imp').click()},'Restore backup'),h('button',{class:'btn danger',onclick:clearHist},'Clear history')),h('input',{id:'imp',type:'file',accept:'application/json',hidden:true,onchange:e=>importB(e.target.files[0])})),
 sec('Help',det('Troubleshooting','Contact stays offline: the other device must have Connectly open (or running in the background). Public Wi-Fi, school or corporate networks and some mobile carriers block direct peer-to-peer links; those need a TURN relay, which Connectly does not include. Try another network, then press Reconnect. “Device ID already registered” means another tab is open.'),
  det('Offline messages','Messages are delivered only while both devices are connected. Anything written while the contact is offline stays on your device marked “Saved locally” and is sent automatically when the link returns. There is no server-side mailbox.'),
  det('Privacy and security','Chats and files travel directly between devices over WebRTC, encrypted in transit (DTLS). The PeerJS signaling service sees device IDs and connection metadata such as IP addresses, not message content. Google’s public STUN server only reveals your public address and relays nothing. This is not a full end-to-end identity system: your protection against impostors is the security code you compared when pairing plus a per-contact secret checked on every reconnect. Leaving to UtiliX closes live connections; they resume when you return.')),
 sec('About',h('p',{},'Connectly v'+VER+' · Connect. Chat. Share.')))}
const savePrefs=()=>safe(dbPut('kv',S.prefs,'prefs'));
async function exportB(){const d={app:'connectly',v:1,at:Date.now(),me:S.me,prefs:S.prefs,contacts:[...S.cs.values()],msgs:await dbAll('msgs')},u=URL.createObjectURL(new Blob([JSON.stringify(d)],{type:'application/json'})),a=h('a',{href:u,download:'connectly-backup-'+new Date().toISOString().slice(0,10)+'.json'});document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),6e4)}
function validB(d){return d&&d.app==='connectly'&&d.v===1&&Array.isArray(d.contacts)&&Array.isArray(d.msgs)&&d.contacts.every(c=>c&&typeof c.id==='string'&&c.id.length<80&&typeof c.name==='string'&&(c.id==='self'||typeof c.key==='string'))&&d.msgs.every(m=>m&&typeof m.id==='string'&&typeof m.chat==='string'&&(m.dir==='in'||m.dir==='out')&&Number.isFinite(m.ts)&&(typeof m.txt==='string'||(m.file&&typeof m.file.name==='string'&&Number.isFinite(m.file.size))))&&(!d.me||/^cly-[a-z2-7]{20}$/.test(d.me.id))}
async function importB(f){if(!f)return;let d;try{d=JSON.parse(await f.text())}catch{return toast('That file is not valid JSON.')}
 if(!validB(d))return toast('Not a valid Connectly backup. Nothing was changed.');
 const cb=h('input',{type:'checkbox',style:'width:auto'});
 const v=await modal('Restore backup?',h('div',{},h('p',{},d.contacts.length+' contacts and '+d.msgs.length+' messages found. Existing items are kept; only missing ones are added.'),h('label',{class:'row'},cb,'Also restore my device identity (only if the old device is no longer used)')),[['Cancel','no'],['Restore','ok','pri']]);if(v!=='ok')return;
 let nc=0,nm=0;for(const c of d.contacts)if(!S.cs.has(c.id)){const x={id:c.id,name:c.name.slice(0,40),key:c.key||'',paused:false,unread:0,created:c.created||Date.now(),last:c.last&&typeof c.last.t==='string'?{t:c.last.t.slice(0,80),ts:+c.last.ts||0}:null,local:c.id==='self'||undefined};S.cs.set(x.id,x);await saveC(x);nc++}
 for(const m of d.msgs){if(!S.cs.has(m.chat)||await dbGet('msgs',m.id))continue;const x={id:m.id,chat:m.chat,dir:m.dir,ts:m.ts};if(m.file){x.file={name:cleanName(m.file.name),type:String(m.file.type||'').slice(0,100),size:m.file.size};x.st=m.st==='done'?'done':'failed';x.err='File content not included in backup'}else{x.txt=String(m.txt).slice(0,8000);x.st=m.dir==='in'?'recv':m.chat==='self'?'note':m.st==='acked'?'acked':'failed'}await saveM(x);nm++}
 if(cb.checked&&d.me){S.me={id:d.me.id,name:String(d.me.name||S.me.name).slice(0,40)};await safe(dbPut('kv',S.me,'me'));startPeer()}
 toast('Restored '+nc+' contacts and '+nm+' messages.');renderList();renderSet()}
async function clearHist(){if(!await confirmM('Clear all history?','All messages and files on this device are deleted. Contacts stay. This cannot be undone. Export a backup first if unsure.','Clear history',1))return;
 await safe(IO('msgs','readwrite',o=>o.clear()));await safe(IO('blobs','readwrite',o=>o.clear()));S.mem.clear();revoke();S.msgs=[];for(const c of S.cs.values()){c.last=null;c.unread=0;await saveC(c)}renderList();if(S.cur)renderMsgs();toast('History cleared.')}
/* ---------- navigation & wiring ---------- */
function go(v){if(v==='util'){location.href=UTIL;return}S.view=v;$('#v-chats').classList.toggle('on',v==='chats');$('#v-set').classList.toggle('on',v==='set');document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));if(v==='set')renderSet()}
document.querySelectorAll('[data-i]').forEach(e=>e.append(ic(e.dataset.i)));
for(const [i,n,l] of [['#addb','add','Add contact'],['#bkb','back'],['#rcb','refresh'],['#srb','search'],['#mnb','more'],['#atb','attach'],['#snb','send']])$(i).append(ic(n));
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>go(b.dataset.v));
$('#addb').onclick=addDialog;$('#sq').oninput=renderList;
$('#bkb').onclick=()=>{$('#v-chats').classList.remove('open');S.cur=null;$('#chat').classList.remove('has');renderList()};
$('#rcb').onclick=()=>{const ct=S.cs.get(S.cur);if(ct.paused){ct.paused=false;saveC(ct)}if(S.sig!=='online')startPeer();else kick(S.cur,true);toast('Reconnecting using the saved contact…')};
$('#srb').onclick=()=>{const s=$('#cs');s.style.display=s.style.display==='block'?'none':'block';if(s.style.display==='block')s.focus();else{S.q='';s.value='';renderMsgs()}};
$('#cs').oninput=e=>{S.q=e.target.value;renderMsgs()};$('#mnb').onclick=()=>contactMenu(S.cur);
$('#snb').onclick=sendMsg;$('#inp').oninput=autosize;$('#inp').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();sendMsg()}};
$('#atb').onclick=()=>$('#fi').click();$('#fi').onchange=e=>{queueFiles([...e.target.files]);e.target.value=''};
addEventListener('online',()=>{S.sigTries=0;if(S.peer&&S.peer.disconnected&&!S.peer.destroyed)S.peer.reconnect();else if(!S.peer||S.peer.destroyed)startPeer();S.cs.forEach(c=>kick(c.id,true))});
addEventListener('offline',()=>setSig('offline','no network'));
document.addEventListener('visibilitychange',()=>{if(document.hidden)return;if(S.sig!=='online'&&S.sigTries<8)sigRetry();S.cs.forEach(c=>{if(lk(c.id).state!=='online'&&lk(c.id).state!=='failed')kick(c.id,false)})});
if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').then(r=>r.addEventListener('updatefound',()=>{const w=r.installing;w.addEventListener('statechange',()=>{if(w.state==='installed'&&navigator.serviceWorker.controller)toast('A new version is ready.',()=>{S.reload=1;w.postMessage('skip')},'Update')})})).catch(()=>{}));
 navigator.serviceWorker.addEventListener('controllerchange',()=>{if(S.reload)location.reload()})}
/* ---------- boot ---------- */
(async()=>{
 try{S.me=await dbGet('kv','me');const pr=await dbGet('kv','prefs');if(pr)Object.assign(S.prefs,pr);for(const c of await dbAll('contacts'))S.cs.set(c.id,c)}
 catch(e){toast('Local storage is unavailable. Chats cannot be saved in this browser.')}
 theme();navigator.storage&&navigator.storage.persist&&navigator.storage.persist().catch(()=>{});
 if(!S.cs.has('self')){const s={id:'self',name:'My Devices',local:true,unread:0};S.cs.set('self',s);await saveC(s)}
 if(!S.me){S.me={id:'cly-'+rnd(20),name:''};}
 if(!S.me.name){S.me.name=await ask('Welcome to Connectly','Your display name','')||'Me';await safe(dbPut('kv',S.me,'me'))}
 S.view='chats';renderList();
 if(!window.isSecureContext)toast('Use localhost or HTTPS: secure features are unavailable here.');
 startPeer()})();
