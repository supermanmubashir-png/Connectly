<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SyncBee</title>
<meta name="theme-color" content="#0b1412">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.png" type="image/png">
<link rel="apple-touch-icon" href="icon.png">
<meta http-equiv="refresh" content="6;url=home.html">
<style>
html,body{margin:0;height:100%;background:#0b1412;overflow:hidden;font-family:system-ui,"Segoe UI",Roboto,sans-serif;color:#cfeee6}
canvas{position:fixed;inset:0;width:100%;height:100%}
#nm{position:fixed;left:0;right:0;text-align:center;font-size:24px;font-weight:600;letter-spacing:.04em;opacity:0;transition:opacity .6s}
.tag{position:fixed;left:0;right:0;bottom:calc(22px + env(safe-area-inset-bottom));text-align:center;font-size:13px;letter-spacing:.1em;opacity:.85}
.tag b{color:#3ee0a0;font-weight:600}
@media(prefers-reduced-motion:reduce){#nm{transition:none}}
</style>
</head>
<body>
<canvas id="c" aria-hidden="true"></canvas>
<div id="nm">SyncBee</div>
<div class="tag">Powered by <b>UtiliX</b></div>
<noscript><meta http-equiv="refresh" content="0;url=home.html"></noscript>
<script>
(()=>{
'use strict';
const GO=()=>{location.replace('home.html')};
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
document.body.addEventListener('click',GO);
const cv=document.getElementById('c'),x=cv.getContext('2d'),nm=document.getElementById('nm');
let W=0,H=0,S=0,CX=0,CY=0;
function size(){const r=window.devicePixelRatio||1;W=innerWidth;H=innerHeight;cv.width=W*r;cv.height=H*r;x.setTransform(r,0,0,r,0,0);S=Math.min(W,H)*.46;CX=W/2;CY=H/2-12;nm.style.top=(CY+S/2+22)+'px'}
size();addEventListener('resize',size);
const T0=performance.now(),DOTS=[],GREEN=[47,227,143],still=matchMedia('(prefers-reduced-motion:reduce)').matches;
let img=null;
function mk(px){ // px: array of {u,v,c} with u,v in -.5..+.5
  for(const p of px)DOTS.push({u:p.u,v:p.v,c:p.c,x0:Math.random()*innerWidth,y0:Math.random()*innerHeight,d:Math.random()*500});
}
function build(){
  const pts=[];
  if(img){
    const N=64,o=document.createElement('canvas');o.width=o.height=N;const g=o.getContext('2d'),r=Math.min(N/img.width,N/img.height),w=img.width*r,h=img.height*r;
    g.drawImage(img,(N-w)/2,(N-h)/2,w,h);
    let d;try{d=g.getImageData(0,0,N,N).data}catch(e){d=null}
    if(d){for(let j=0;j<N;j+=2)for(let i=0;i<N;i+=2){const k=(j*N+i)*4;if(d[k+3]>128)pts.push({u:i/N-.5,v:j/N-.5,c:[d[k],d[k+1],d[k+2]]})}}
  }
  if(!pts.length){ // icon.png missing: form a ring
    for(let a=0;a<360;a+=1.2){const t=a*Math.PI/180;pts.push({u:Math.cos(t)*.4,v:Math.sin(t)*.4,c:GREEN})}
  }
  while(pts.length>900)pts.splice(Math.floor(Math.random()*pts.length),1);
  mk(pts);
}
const ease=t=>1-Math.pow(1-t,3),mix=(a,b,k)=>Math.round(a+(b-a)*k);
function frame(now){
  const e=now-T0;x.clearRect(0,0,W,H);
  const dotA=e<2300?1:Math.max(0,1-(e-2300)/450),imgA=img?Math.min(1,Math.max(0,(e-2300)/500)):0;
  if(dotA>0){
    const rad=Math.max(1.4,S/60);
    for(const p of DOTS){
      const k=still?1:ease(Math.min(1,Math.max(0,(e-p.d)/1700)));
      const px=p.x0+(CX+p.u*S*2-p.x0)*k,py=p.y0+(CY+p.v*S*2-p.y0)*k;
      x.globalAlpha=dotA;x.fillStyle='rgb('+mix(GREEN[0],p.c[0],k)+','+mix(GREEN[1],p.c[1],k)+','+mix(GREEN[2],p.c[2],k)+')';
      x.beginPath();x.arc(px,py,rad,0,6.283);x.fill();
    }
  }
  if(imgA>0){
    const r=Math.min(S*2/img.width,S*2/img.height),w=img.width*r,h=img.height*r;
    x.globalAlpha=imgA;x.drawImage(img,CX-w/2,CY-h/2,w,h);
  }
  x.globalAlpha=1;
  if(e>2000)nm.style.opacity=1;
  if(e>=3000){GO();return}
  requestAnimationFrame(frame);
}
const im=new Image();
im.onload=()=>{img=im;build()};
im.onerror=()=>{build()};
im.src='icon.png';
requestAnimationFrame(frame);
setTimeout(GO,3200); // safety net if animation frames are throttled
})();
</script>
</body>
</html>
