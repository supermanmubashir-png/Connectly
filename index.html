<style>
:root{--bg:#f3f6f5;--card:#fff;--tx:#17201f;--mut:#617370;--ac:#0f9d8f;--acs:#d6f1ed;--out:#c8eee8;--in:#fff;--bd:#e0e8e6;--err:#d64545;--warn:#c9821a;--ok:#1d9b57;--r:20px}

*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font:15px/1.4 system-ui,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);overflow:hidden}

.view{position:absolute;inset:0;display:none}.view.on{display:flex}

.ci:hover,.ci.sel{background:var(--acs)}

.cm span{color:var(--mut);font-size:13px}.ct{font-size:12px;color:var(--mut);text-align:right}
.bg{background:var(--ac);color:#fff;border-radius:999px;font-size:12px;padding:1px 7px;display:inline-block;margin-top:3px}
#chat{display:none;flex:1;flex-direction:column;min-width:0}
#v-chats.open #list{display:none}#v-chats.open #chat{display:flex}

#chat.has #cc{display:flex}#chat.has #emp{display:none}

#cs{display:none;margin:6px 12px}
#msgs{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:6px}
.m{max-width:min(78%,560px);padding:8px 12px;border-radius:18px;position:relative;word-wrap:break-word;overflow-wrap:anywhere}
.m.in{background:var(--in);align-self:flex-start;border-bottom-left-radius:6px}
.m.out{background:var(--out);align-self:flex-end;border-bottom-right-radius:6px}
.m .tx{white-space:pre-wrap}.m .mt{font-size:11px;color:var(--mut);margin-top:2px;display:flex;gap:6px;align-items:center;justify-content:flex-end}
.m .mb{background:none;border:0;color:var(--mut);cursor:pointer;padding:0 4px}
.file .fn{font-weight:600}.file .fs{font-size:12px;color:var(--mut)}.file .err,.m .er{color:var(--err)}
.bar{height:6px;background:var(--bd);border-radius:6px;overflow:hidden;margin:6px 0;min-width:180px}.bar i{display:block;height:100%;background:var(--ac)}
.pv{max-width:100%;max-height:260px;border-radius:12px;margin-top:6px;display:block}
#cp{display:flex;gap:6px;align-items:flex-end;padding:8px 10px calc(8px);background:var(--card);border-top:1px solid var(--bd)}
#cp textarea{resize:none;max-height:120px;border-radius:22px}
/* settings */
#v-set{overflow:auto;padding:12px;flex-direction:column;gap:12px;align-items:center}
.card{background:var(--card);border-radius:var(--r);padding:16px;width:100%;max-width:720px}
.card h2{margin:0 0 8px;font-size:16px}.card p{margin:6px 0;color:var(--mut)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row.end{justify-content:flex-end;margin-top:14px}
.row>*{flex:0 1 auto}.grow{flex:1 1 160px!important}
details summary{cursor:pointer;padding:6px 0}details p{color:var(--mut)}

nav button{flex:1;background:none;border:0;border-radius:999px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:1px;font-size:11px;cursor:pointer;padding:7px 4px;transition:background .25s,color .25s}
nav .pill{display:grid;place-items:center}
nav svg{width:22px;height:22px;fill:currentColor}
nav button.on{background:var(--acs);color:var(--ac);font-weight:600}
@media(max-width:819px){body.inchat nav{display:none}}
@media(min-width:820px){nav{left:20px;transform:none;width:320px}}
dialog{border:0;border-radius:28px;background:var(--card);color:var(--tx);padding:20px;width:min(460px,92vw)}
dialog::backdrop{background:rgba(0,0,0,.45)}dialog h3{margin:0 0 10px}dialog p{color:var(--mut);margin:6px 0}
.mono{font-family:ui-monospace,Consolas,monospace;font-size:13px;word-break:break-all}
#toasts{position:fixed;left:0;right:0;bottom:calc(84px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;z-index:9}
.toast{background:#263130;color:#fff;border-radius:16px;padding:10px 16px;pointer-events:auto;max-width:92vw;display:flex;gap:12px;align-items:center}
.toast button{background:none;border:0;color:#7fe3d8;cursor:pointer}
@media(min-width:820px){#list{width:360px;flex:none;border-right:1px solid var(--bd)}#chat{display:flex}#v-chats.open #list{display:flex}.bk{display:none!important}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

   <input id="sq" type="search" placeholder="Search chats" aria-label="Search chats">
   <div class="chips" id="chips"></div>
   <div id="cl"></div>
   <div id="stp" style="display:none;flex:1;overflow:auto;padding:4px 12px"></div>
  </div>
  <div id="chat">

   <div id="cc">

    </div>
    <input id="cs" type="search" placeholder="Search in conversation" aria-label="Search in conversation">
    <div id="msgs" role="log" aria-live="polite"></div>
    <div id="rb"></div><div id="em"></div>
    <div id="cp">
     <button class="ib" id="atb" aria-label="Attach files"></button>
     <button class="ib" id="emb" aria-label="Emoji">😊</button>
     <textarea id="inp" rows="1" placeholder="Message" aria-label="Message"></textarea>
     <button class="ib" id="snb" aria-label="Send"></button>
     <input type="file" id="fi" multiple hidden>
    </div>
   </div>
  </div>
 </section>
 <section class="view" id="v-set"></section>
</main>
<nav aria-label="Main">
 <button data-v="chats" class="on"><span class="pill" data-i="chat"></span>Chats</button>
 <button data-v="util"><span class="pill" data-i="grid"></span>UtiliX</button>
 <button data-v="set"><span class="pill" data-i="tune"></span>Settings</button>
</nav>
</div>

$('#addb').onclick=()=>S.tab==='status'?addStatus():addDialog();$('#sq').oninput=renderList;
$('#bkb').onclick=()=>{$('#v-chats').classList.remove('open');S.cur=null;$('#chat').classList.remove('has');renderList();syncNav()};
$('#rcb').onclick=()=>{const ct=S.cs.get(S.cur);if(ct.paused){ct.paused=false;saveC(ct)}if(S.sig!=='online')startPeer();else kick(S.cur,true);toast('Reconnecting using the saved contact…')};
$('#srb').onclick=()=>{const s=$('#cs');s.style.display=s.style.display==='block'?'none':'block';if(s.style.display==='block')s.focus();else{S.q='';s.value='';renderMsgs()}};
$('#cs').oninput=e=>{S.q=e.target.value;renderMsgs()};$('#mnb').onclick=()=>contactMenu(S.cur);
$('#snb').onclick=sendMsg;$('#inp').oninput=()=>{autosize();if(S.prefs.typ&&S.cur&&S.cur!=='self'){const c=lk(S.cur).conn;if(c&&c.open&&Date.now()-(S.tpt||0)>3000){S.tpt=Date.now();c.send({v:1,t:'typ',on:1})}}};$('#inp').onkeydown=e=>{if(e.key==='Enter'&&!e.isComposing){const go=S.prefs.enter?!e.shiftKey:(e.ctrlKey||e.metaKey);if(go){e.preventDefault();sendMsg()}}};
$('#atb').onclick=()=>$('#fi').click();$('#fi').onchange=e=>{queueFiles([...e.target.files]);e.target.value=''};
addEventListener('online',()=>{S.sigTries=0;if(S.peer&&S.peer.disconnected&&!S.peer.destroyed)S.peer.reconnect();else if(!S.peer||S.peer.destroyed)startPeer();S.cs.forEach(c=>kick(c.id,true))});
addEventListener('offline',()=>setSig('offline','no network'));
document.addEventListener('visibilitychange',()=>{if(document.hidden)return;if(S.cur)sendRead(S.cur);if(S.sig!=='online'&&S.sigTries<8)sigRetry();S.cs.forEach(c=>{if(lk(c.id).state!=='online'&&lk(c.id).state!=='failed')kick(c.id,false)})});
if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').then(r=>r.addEventListener('updatefound',()=>{const w=r.installing;w.addEventListener('statechange',()=>{if(w.state==='installed'&&navigator.serviceWorker.controller)toast('A new version is ready.',()=>{S.reload=1;w.postMessage('skip')},'Update')})})).catch(()=>{}));
 navigator.serviceWorker.addEventListener('controllerchange',()=>{if(S.reload)location.reload()})}
/* ---------- profile, receipts, status, extras ---------- */
const AC=[['teal','#0f9d8f'],['blue','#2f7de1'],['purple','#7c5cd6'],['rose','#d6457a'],['amber','#d98a1c'],['green','#2e9b4f']];
const tg=(label,key,on)=>h('label',{class:'row'},h('input',{type:'checkbox',style:'width:auto',checked:S.prefs[key],onchange:e=>{S.prefs[key]=e.target.checked;savePrefs();on&&on(e.target.checked)}}),label);
const sel=(label,key,opts)=>[h('p',{},label),h('select',{'aria-label':label,onchange:e=>{S.prefs[key]=e.target.value;savePrefs();theme()}},opts.map(([v,l])=>h('option',{value:v,selected:S.prefs[key]===v},l)))];
const stWho=()=>{const m=S.prefs.stMode,n=(S.prefs.stList||[]).length;return m==='all'?'All contacts':m==='except'?'All except '+n:'Only '+n+' selected'};
async function shrink(f,max,q,lim){try{const bm=await createImageBitmap(f),r=Math.min(1,max/Math.max(bm.width,bm.height)),cv=document.createElement('canvas');cv.width=Math.max(1,Math.round(bm.width*r));cv.height=Math.max(1,Math.round(bm.height*r));cv.getContext('2d').drawImage(bm,0,0,cv.width,cv.height);let o=cv.toDataURL('image/jpeg',q);while(o.length>lim&&q>.3){q-=.1;o=cv.toDataURL('image/jpeg',q)}return o.length<=lim?o:null}catch{return null}}
async function saveProf(p){Object.assign(S.me,p);await safe(dbPut('kv',S.me,'me'));S.cs.forEach(c=>c.id!=='self'&&sendProf(c.id));renderSet()}
function sendProf(id){const c=lk(id).conn;if(c&&c.open)c.send({v:1,t:'prof',name:S.me.name,about:S.me.about||'',av:S.prefs.showAv?(S.me.av||''):''})}
function onProf(id,d){const ct=S.cs.get(id);if(!ct)return;const nm=typeof d.name==='string'?d.name.trim().slice(0,40):'';if(nm){ct.rname=nm;if(!ct.nick)ct.name=nm}
 ct.about=typeof d.about==='string'?d.about.slice(0,140):'';ct.av=typeof d.av==='string'&&d.av.startsWith('data:image/jpeg;base64,')&&d.av.length<80000?d.av:'';saveC(ct);renderList();if(S.cur===id)renderHead()}
function sendRead(id){if(!S.prefs.rcpt||document.hidden||S.cur!==id||id==='self')return;const c=lk(id).conn;if(!c||!c.open)return;const ms=S.msgs.filter(m=>m.dir==='in'&&!m.rd&&!m.del).slice(-100);if(!ms.length)return;c.send({v:1,t:'read',ids:ms.map(wid)});ms.forEach(m=>{m.rd=1;saveM(m)})}
async function onRead(id,d){if(!S.prefs.rcpt||!Array.isArray(d.ids))return;for(const mid of d.ids.slice(0,200)){if(typeof mid!=='string')continue;const m=await loc(id,mid,'out');if(m&&!m.file&&!m.del&&m.st!=='read')await upd(m,{st:'read'})}}
async function showStarred(id){const all=(await dbAll('msgs')).filter(m=>m.star&&!m.del&&(!id||m.chat===id)).sort((a,b)=>b.ts-a.ts).slice(0,60);
 await modal(id?'Starred messages':'All starred messages',h('div',{style:'max-height:55vh;overflow:auto'},all.length?all.map(m=>h('p',{},h('b',{},(S.cs.get(m.chat)||{}).name||'?'),' · '+fmtT(m.ts)+' · '+(m.file?'📎 '+m.file.name:(m.txt||'').slice(0,160)))):h('p',{},'Nothing starred yet. Open a message’s ⋮ menu and choose Star.')),[['Close','no']])}
async function purge(){for(const c of S.cs.values()){if(!c.dis)continue;const lim=Date.now()-c.dis*1000,ms=await dbChat(c.id);let ch=0;for(const m of ms)if(m.ts<lim&&!m.star){await dbDel('msgs',m.id);if(m.file)await dbDel('blobs',m.id).catch(()=>{});S.mem.delete(m.id);ch=1}if(ch&&S.cur===c.id){S.msgs=S.msgs.filter(m=>m.ts>=lim||m.star);renderMsgs()}}}
/* status */
const DAY=864e5,stAllowed=id=>{const m=S.prefs.stMode,l=S.prefs.stList||[];return m==='all'||(m==='except'?!l.includes(id):l.includes(id))};
function stPrune(){const n=Date.now();S.sts.mine=S.sts.mine.filter(x=>n-x.ts<DAY);for(const k in S.sts.theirs){S.sts.theirs[k]=S.sts.theirs[k].filter(x=>n-x.ts<DAY);if(!S.sts.theirs[k].length||!S.cs.has(k))delete S.sts.theirs[k]}}
const stSave=()=>safe(dbPut('kv',S.sts,'st'));
function stSendTo(id){const c=lk(id).conn;if(!c||!c.open)return;const ok=stAllowed(id)?S.sts.mine:[];for(const x of ok)c.send({v:1,t:'st',id:x.id,ts:x.ts,k:x.k,txt:x.txt||'',bg:x.bg||'',img:x.img||''});c.send({v:1,t:'stl',ids:ok.map(x=>x.id)})}
function onSt(id,d){if(typeof d.id!=='string'||d.id.length>40||!['text','img'].includes(d.k)||typeof d.txt!=='string'||!Number.isFinite(d.ts))return;
 if(d.k==='img'&&!(typeof d.img==='string'&&d.img.startsWith('data:image/jpeg;base64,')&&d.img.length<400000))return;
 const a=S.sts.theirs[id]||(S.sts.theirs[id]=[]);if(a.some(x=>x.id===d.id))return;
 a.push({id:d.id,ts:Math.min(d.ts,Date.now()),k:d.k,txt:d.txt.slice(0,700),bg:/^#[0-9a-f]{6}$/i.test(d.bg)?d.bg:'#0f9d8f',img:d.k==='img'?d.img:'',seen:false});a.sort((x,y)=>x.ts-y.ts);if(a.length>20)a.splice(0,a.length-20);stSave();if(S.tab==='status')renderStatus()}
async function postStatus(x){S.sts.mine.push(x);await stSave();S.cs.forEach(c=>c.id!=='self'&&stAllowed(c.id)&&stSendTo(c.id));renderStatus()}
async function addStatus(){const cols=['#0f9d8f','#2f7de1','#7c5cd6','#d6457a','#d98a1c','#3a4a49'];let bg=cols[0],img=null;
 const ta=h('textarea',{rows:4,maxlength:700,placeholder:'Type a status','aria-label':'Status text'}),sw=h('div',{class:'sw'}),pv=h('p',{},'');
 const paint=()=>{sw.replaceChildren(...cols.map(c=>h('button',{class:c===bg?'on':'',style:'background:'+c,'aria-label':'Background '+c,onclick:()=>{bg=c;paint()}})));ta.style.background=img?'':bg;ta.style.color=img?'':'#fff'};
 const fi=h('input',{type:'file',accept:'image/*','aria-label':'Status photo',onchange:async e=>{const f=e.target.files[0];if(!f)return;img=await shrink(f,720,.72,150000);pv.textContent=img?'Photo attached; the text becomes its caption.':'Could not use that image.';paint()}});paint();
 const v=await modal('New status',h('div',{},ta,h('p',{},'Background'),sw,h('p',{},'Or add a photo:'),fi,pv,h('p',{},'Visible for 24 hours to the contacts allowed in Status privacy, delivered only while they are online with you.')),[['Cancel','no'],['Post','ok','pri']]);
 if(v!=='ok')return;const txt=ta.value.trim();if(!txt&&!img)return toast('Add text or a photo.');
 await postStatus({id:rnd(14),ts:Date.now(),k:img?'img':'text',txt,bg,img:img||''});toast('Status posted.')}
async function stSettings(){const sl=h('select',{'aria-label':'Who can see my status'},[['all','All my contacts'],['except','All except…'],['only','Only share with…']].map(([v,l])=>h('option',{value:v,selected:S.prefs.stMode===v},l)));
 const cb=[...S.cs.values()].filter(c=>c.id!=='self').map(c=>[c,h('input',{type:'checkbox',style:'width:auto',checked:(S.prefs.stList||[]).includes(c.id)})]);
 const v=await modal('Status privacy',h('div',{},sl,h('p',{},'Contacts used by “except” or “only”:'),...cb.map(([c,i])=>h('label',{class:'row'},i,c.name))),[['Cancel','no'],['Save','ok','pri']]);
 if(v!=='ok')return;S.prefs.stMode=sl.value;S.prefs.stList=cb.filter(([,i])=>i.checked).map(([c])=>c.id);savePrefs();S.cs.forEach(c=>c.id!=='self'&&stSendTo(c.id));if(S.view==='set')renderSet();toast('Status privacy saved.')}
function viewSt(list,owner,name){let i=owner==='me'?0:Math.max(0,list.findIndex(x=>!x.seen)),tm;const ov=h('div',{class:'ov',role:'dialog','aria-label':'Status',tabindex:-1});
 const close=()=>{clearTimeout(tm);ov.remove();renderStatus()};ov.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
 const show=()=>{clearTimeout(tm);const x=list[i];if(!x)return close();
  if(owner!=='me'){x.seen=true;stSave();const c=lk(owner).conn;if(c&&c.open&&S.prefs.rcpt)c.send({v:1,t:'sv',id:x.id})}
  const vw=owner==='me'?Object.keys(x.vw||{}).map(k=>(S.cs.get(k)||{}).name||'Unknown'):[];
  ov.replaceChildren(h('div',{class:'pb'},list.map((_,j)=>h('i',{class:j<=i?'d':''}))),
   h('div',{class:'tp'},h('span',{},name+' · '+fmtT(x.ts)),h('button',{class:'ib','aria-label':'Close',onclick:close},'✕')),
   h('div',{class:'sc',style:x.k==='text'?'background:'+x.bg:null,onclick:e=>{i=Math.max(0,i+(e.clientX<innerWidth/3?-1:1));show()}},x.k==='img'?[h('img',{src:x.img,alt:''}),x.txt?h('p',{},x.txt):null]:x.txt),
   owner==='me'?h('div',{class:'tp'},h('span',{},'Viewed by '+(vw.length?vw.join(', '):'nobody yet')),h('button',{class:'btn danger',onclick:async()=>{S.sts.mine=S.sts.mine.filter(y=>y!==x);list.splice(i,1);await stSave();S.cs.forEach(c=>c.id!=='self'&&stSendTo(c.id));if(!list.length)close();else{i=Math.min(i,list.length-1);show()}}},'Delete')):null);
  tm=setTimeout(()=>{i++;show()},6000)};
 document.body.append(ov);ov.focus();show()}
function renderStatus(){stPrune();const p=$('#stp');if(!p||S.tab!=='status')return;const mine=S.sts.mine;
 const rows=[h('button',{class:'ci',onclick:()=>mine.length?viewSt([...mine],'me','My status'):addStatus()},avEl(S.me.name,S.me.av,mine.length?'ring':''),h('div',{class:'cm'},h('b',{},'My status'),h('span',{},mine.length?mine.length+' active · tap to view':'Tap to add a status update'))),
  h('div',{class:'row',style:'padding:4px 10px'},h('button',{class:'btn',onclick:addStatus},'＋ New status'),h('button',{class:'btn',onclick:stSettings},'Status privacy')),h('div',{class:'sig',style:'padding:10px 10px 4px'},'Recent updates')];
 const th=Object.keys(S.sts.theirs).map(k=>({c:S.cs.get(k),l:S.sts.theirs[k]})).filter(x=>x.c&&!x.c.smute&&x.l.length).sort((a,b)=>b.l[b.l.length-1].ts-a.l[a.l.length-1].ts);
 if(!th.length)rows.push(h('div',{class:'empty'},'No updates yet. Contacts’ statuses arrive when they are online with you and share with you, and vanish after 24 hours.'));
 for(const x of th)rows.push(h('button',{class:'ci',onclick:()=>viewSt(x.l,x.c.id,x.c.name)},avEl(x.c.name,x.c.av,'ring'+(x.l.some(y=>!y.seen)?'':' seen')),h('div',{class:'cm'},h('b',{},x.c.name),h('span',{},fmtT(x.l[x.l.length-1].ts)))));
 p.replaceChildren(...rows)}
function setTab(t){S.tab=t;document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));const st=t==='status';$('#cl').style.display=$('#sq').style.display=$('#chips').style.display=st?'none':'';$('#stp').style.display=st?'block':'none';$('#addb').setAttribute('aria-label',st?'New status':'Add contact');if(st)renderStatus()}

['😀','😂','🥹','😍','😘','😎','🤔','😢','😭','😡','👍','👎','🙏','👏','🔥','🎉','❤️','💯','🤝','🙌','😅','🥳','😴','🤗','😮'].forEach(e=>$('#em').append(h('button',{type:'button','aria-label':e,onclick:()=>{const i=$('#inp');i.setRangeText(e,i.selectionStart,i.selectionEnd,'end');autosize();i.focus()}},e)));

/* ---------- boot ---------- */
(async()=>{
 try{S.me=await dbGet('kv','me');const pr=await dbGet('kv','prefs');if(pr)Object.assign(S.prefs,pr);for(const c of await dbAll('contacts'))S.cs.set(c.id,c);S.sts=(await dbGet('kv','st'))||S.sts}
 catch(e){toast('Local storage is unavailable. Chats cannot be saved in this browser.')}
 theme();navigator.storage&&navigator.storage.persist&&navigator.storage.persist().catch(()=>{});
 if(!S.cs.has('self')){const s={id:'self',name:'My Devices',local:true,unread:0};S.cs.set('self',s);await saveC(s)}
 if(!S.me){S.me={id:'cly-'+rnd(20),name:''};}

 S.view='chats';stPrune();purge();renderList();syncNav();
